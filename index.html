<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141517">
<title>Trénink</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: jednosloupcová appka do telefonu. Každá sekce má barvu kotouče: Dnes modrá, Trénink červená, Jídlo zelená, Peníze žlutá. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
:root{
  --bg:#e9ecf0;--surface:#ffffff;--raise:#f3f5f8;--fg:#12161c;--muted:#667080;--line:#dce0e6;
  --plate-red:#d8352c;--plate-blue:#2d62dc;--plate-yellow:#c98f00;--plate-green:#1d9a57;
  --accent:var(--plate-blue);--on-accent:#ffffff;--ok:#1d9a57;--warn:#c26a00;--fig:#12161c;--fig-eq:#9aa2ae;
  --shadow:0 1px 2px rgba(18,22,28,.06),0 4px 14px rgba(18,22,28,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:20px;--r-ctl:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d;--surface:#1a1f28;--raise:#232a35;--fg:#eef1f5;--muted:#8e97a6;--line:#2c3441;
  --plate-red:#f2564c;--plate-blue:#6c95f7;--plate-yellow:#f3c23a;--plate-green:#3fc67f;
  --on-accent:#0f1217;--ok:#3fc67f;--warn:#f0a03c;--fig:#eef1f5;--fig-eq:#6c7686;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d;--surface:#1a1f28;--raise:#232a35;--fg:#eef1f5;--muted:#8e97a6;--line:#2c3441;
  --plate-red:#f2564c;--plate-blue:#6c95f7;--plate-yellow:#f3c23a;--plate-green:#3fc67f;
  --on-accent:#0f1217;--ok:#3fc67f;--warn:#f0a03c;--fig:#eef1f5;--fig-eq:#6c7686;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:32px;line-height:1}
h2{font-size:22px;line-height:1.1}
h3{font-size:20px;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
#syncInfo{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--surface);white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
a{color:var(--accent)}
main{display:flex;flex-direction:column;gap:12px;padding-top:8px}
main.slide-l{animation:slideL .22s ease-out}main.slide-r{animation:slideR .22s ease-out}
@keyframes slideL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}

/* karty a texty */
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card.flat{background:transparent;box-shadow:none;padding:4px 2px}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.tip{font-size:15px}
.empty{color:var(--muted);font-size:15px;padding:4px 0}
.big{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.saved{color:var(--ok);font-weight:600;text-align:center}

/* ovládací prvky */
button{font-family:var(--body)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.btn{display:block;font:700 19px var(--display);letter-spacing:.02em;background:var(--accent);color:var(--on-accent);border:none;border-radius:16px;padding:15px 18px;width:100%;cursor:pointer;text-align:center;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--raise);color:var(--fg);font:600 15px var(--body);padding:12px 14px}
.mini{font:600 14px var(--body);background:none;border:none;color:var(--accent);cursor:pointer;padding:6px 2px;text-decoration:none}
.mini:disabled{color:var(--muted);opacity:.5}
.arrow{min-width:38px;height:38px;border-radius:12px;border:none;background:var(--raise);color:var(--fg);font:700 18px var(--body);cursor:pointer;line-height:1;padding:0 10px}
.arrow:disabled{opacity:.35}
.arrow.wide{font-size:14px;padding:0 14px}
input[type=number],input[type=text],input[type=search],input[type=date],input[type=password],select,.txt{
  width:100%;min-width:0;font:600 17px var(--body);padding:11px 12px;border:1.5px solid transparent;border-radius:var(--r-ctl);background:var(--raise);color:var(--fg);font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bwrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bwrow input{max-width:140px}
.switch{display:flex;gap:12px;align-items:center;font-size:16px;cursor:pointer}
.switch input{width:24px;height:24px;accent-color:var(--accent);flex:0 0 auto}

/* hlavička: segmenty a čipy */
.subnav{display:flex;gap:4px;margin-top:12px;background:var(--surface);border-radius:14px;padding:4px}
.subnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:600 14px var(--body);padding:8px 4px;border-radius:10px}
.subnav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:none;background:var(--surface);color:var(--fg);font:600 15px var(--body);padding:9px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-accent)}
.chip[aria-pressed="true"] .dot{background:var(--on-accent)}
.chip .next{font-size:12px;opacity:.75;font-weight:500}
.chip.mode{color:var(--muted);font-weight:500}
.status{font-size:14px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--surface)}
.status.err{box-shadow:inset 3px 0 0 var(--warn)}
#clock{font:600 15px var(--display);color:var(--muted)}
#clock b{color:var(--fg);font-size:18px}

/* spodní lišta */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
nav .in{display:flex;gap:2px;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font:600 11px var(--body);padding:7px 0 6px;border-radius:16px}
nav a svg{width:24px;height:24px}
nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
nav a[data-v="dnes"]{--accent:var(--plate-blue)}nav a[data-v="trenink"]{--accent:var(--plate-red)}nav a[data-v="jidlo"]{--accent:var(--plate-green)}nav a[data-v="penize"]{--accent:var(--plate-yellow)}nav a[data-v="profil"]{--accent:var(--fg)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;border:none;border-radius:20px;background:var(--accent);color:var(--on-accent);
  font:700 19px var(--display);padding:15px 20px;box-shadow:0 6px 20px rgba(0,0,0,.22);cursor:pointer;display:flex;gap:8px;align-items:center}

/* kotoučový kruh */
.plate{position:relative;width:132px;height:132px;flex:0 0 auto}
.plate svg{width:100%;height:100%;display:block}
.plate .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.plate .in b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.plate .in span{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero>div{min-width:0;display:flex;flex-direction:column;gap:10px}

/* pruhy */
.mbar{display:flex;flex-direction:column;gap:5px;font-size:14px;min-width:0}
.mbar b{font-variant-numeric:tabular-nums;font-weight:600}
.track{height:8px;border-radius:4px;background:var(--raise);overflow:hidden}.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.mbar.pro .track i{background:var(--plate-blue)}.mbar.over .track i{background:var(--warn)}
.mbar.s .track i{background:var(--plate-yellow)}.mbar.t .track i{background:var(--plate-red)}

/* voda a doplňky */
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:28px;height:34px;border-radius:5px 5px 9px 9px;border:2px solid var(--plate-blue);background:transparent;opacity:.4;padding:0;cursor:pointer}
.glass.on{background:var(--plate-blue);opacity:1}
.supps{display:flex;flex-wrap:wrap;gap:8px}
.supp{display:flex;align-items:center;gap:10px;border:none;background:var(--raise);color:var(--fg);border-radius:14px;padding:10px 14px;font:600 15px var(--body);cursor:pointer}
.supp .pips{display:flex;gap:4px}.supp .pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ok)}.supp .pips i.on{background:var(--ok)}
.supp.done{background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.supp span{font-weight:400;color:var(--muted);font-size:13px}

/* seznamy */
.hist{display:flex;flex-direction:column}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.it:last-child{border-bottom:none}
.it>span:first-child{min-width:0}
.it.tap{cursor:pointer}
.editbox{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--raise);border-radius:16px;margin:6px 0}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 2px;border:none;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:500 16px var(--body);text-align:left;cursor:pointer}
.frow .hint{white-space:nowrap}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qf{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 12px;border-radius:14px;border:none;background:var(--raise);color:var(--fg);font:600 14px var(--body);cursor:pointer;max-width:100%;text-align:left}
.qf span{font-weight:400;font-size:12px;color:var(--muted)}
.qf[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}.qf[aria-pressed="true"] span{color:inherit;opacity:.8}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{font:600 13px var(--body);padding:10px 4px;border-radius:12px;border:none;background:var(--raise);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.scanv{width:100%;max-height:280px;border-radius:16px;background:#000;object-fit:cover}

/* jídla dne */
.meal{display:flex;flex-direction:column;gap:0}
.mealhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mealhead h3{font-size:20px}
.mealhead .kc{font:600 16px var(--display);color:var(--muted);margin-left:auto;margin-right:6px}
.plus{width:38px;height:38px;border-radius:12px;border:none;background:var(--accent);color:var(--on-accent);font:700 22px/1 var(--body);cursor:pointer}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:56px;border-radius:16px;border:none;background:var(--raise);color:var(--fg);font:700 26px var(--body);cursor:pointer}
.stepper input{text-align:center;font:700 30px var(--display);height:56px}
.macros4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.macros4 div{background:var(--raise);border-radius:12px;padding:8px 2px}
.macros4 b{display:block;font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.macros4 span{font-size:12px;color:var(--muted)}

/* KPI a grafy */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;color:var(--fg)}
.an{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px;font-variant-numeric:tabular-nums}
.an .d{text-align:right;font-weight:700}
.an .up{color:var(--ok)}.an .dn{color:var(--warn)}
.an .nx{grid-column:1/-1;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center}
.cal .day{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-variant-numeric:tabular-nums}
.cal .day b{display:flex;gap:2px}.cal .day i{width:8px;height:8px;border-radius:50%;display:block}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .day.fut{opacity:.35}
.cover{display:flex;flex-wrap:wrap;gap:6px}
.cover span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--raise);color:var(--muted)}
.cover .on{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:var(--fg);font-weight:600}

/* trénink */
.ex{gap:14px}
.slotbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.alts{display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.ex-top{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;touch-action:pan-y}
.ex-top>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.demo{width:104px;height:84px;border-radius:14px;background:var(--raise);color:var(--fig)}
.target{font:700 24px/1.1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.eqs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.eqs i{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--raise);color:var(--accent)}
.badge{white-space:nowrap;display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--raise);color:var(--muted)}
.badge.cal{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.badge.st{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.plan{font-size:14px;display:flex;flex-direction:column;gap:4px;background:var(--raise);border-radius:14px;padding:10px 12px}
.legend{font-size:13px;color:var(--muted)}
.legend b{color:var(--fg)}
details.tip summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.sets .h{font-size:12px;color:var(--muted);font-weight:600}
.sets input{padding:10px 8px;text-align:center;font-size:18px}
.n.chk{width:30px;height:44px;border:none;background:none;color:var(--muted);font:700 19px var(--display);cursor:pointer;padding:0}
.n.chk[aria-pressed="true"]{color:var(--ok);font-size:24px}
.eff{display:flex;gap:4px}
.eff button{min-width:42px;height:44px;padding:0 8px;border-radius:12px;border:none;background:var(--raise);color:var(--muted);font:700 14px var(--body);cursor:pointer}
.eff button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.eff button.lim[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sets .lastrow{grid-column:1/-1;font-size:13px;color:var(--accent);font-weight:600;margin-top:-4px}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.checkin{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.seg button,.sore button{font:600 14px var(--body);padding:11px 2px;border-radius:12px;border:none;background:var(--raise);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sore{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sore button{text-align:left;padding:11px 12px;display:flex;justify-content:space-between;gap:6px}
.sore button[data-l="1"]{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}
.sore button[data-l="2"]{background:var(--warn);color:var(--on-accent)}
.prog-ex{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.prog-ex>div{min-width:0}
.prog-ex .demo{width:76px;height:62px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* průvodce a profil */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border-radius:16px;border:none;background:var(--raise);color:var(--fg);font:600 16px var(--body);cursor:pointer}
.choice span{font-size:14px;color:var(--muted);font-weight:400}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg2 .choice{align-items:center;padding:11px}
.maxrow{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px;align-items:end}
.maxrow>span{font-weight:600;padding-bottom:12px}
.platechips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{min-width:56px;padding:10px 12px;border-radius:999px;border:none;background:var(--raise);color:var(--muted);font:700 15px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.stepdots{display:flex;gap:6px;justify-content:center;padding:4px 0}
.stepdots i{width:32px;height:5px;border-radius:3px;background:var(--line)}.stepdots i.on{background:var(--accent)}
details.card>summary{cursor:pointer;list-style:none}
a.card.link,a.link{text-decoration:none;color:var(--fg)}
.chev{color:var(--muted);font-size:20px;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#fPanel{display:flex;flex-direction:column;gap:22px}
.grp{display:flex;flex-direction:column;gap:10px}
.quick.hscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.quick.hscroll::-webkit-scrollbar{display:none}.quick.hscroll .qf{flex:0 0 auto}
.stepper{gap:10px}
details>summary.mini{list-style:none;cursor:pointer}
.tag{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:6px;background:var(--ok)}
.tag.pro{background:var(--plate-blue)}.tag.over{background:var(--warn)}.tag.t{background:var(--plate-red)}.tag.s{background:var(--plate-yellow)}

const ENERGY=["Na nic","Slabší","Normál","Dobrý","Nabitý"],ENERGY_F=[.9,.95,1,1.02,1.04],SORE_F=[1,.96,.9];

function model(name,beforeTs=Infinity){

function targetFor(ex,slot,R){
  const b=bw(),pf=pushFor(ex.n);
  if(ex.t==="kardio")return {kg:0,reps:slot.r1,pf};
  if(ex.simple){const L=lastSets(ex.n),best=L?Math.max(...L.sets.map(s=>s[1])):0,st=ex.sec?5:1;
    return {kg:0,reps:best?Math.max(slot.r1,best+(best>=slot.r2?st:Math.min(st,slot.r2-best))):slot.r1,first:!best,simple:true,pf};}
  let m=model(ex.n),first=false;
  if(!m){const sd=ex.ref?refs()[ex.ref]*ex.ratio*.92:0;m={est:sd,n:0};first=true;}
  const goal=m.est*R*(1+(first?0:pf.p));
  if(ex.t==="telo"){
    const base=b*(ex.lf||1),extra=goal/(1+(slot.r2+2)/30)-base;
    const allowKg=curMode()==="gym"&&ex.lf===1;
    if(!allowKg||extra<STEP(ex)){const reps=Math.max(1,Math.min(60,Math.floor(30*(goal/base-1)-2)));return {kg:0,reps:Math.min(reps,slot.r2+5),harder:reps>slot.r2+2,cal:m.n<3,first,pf};}
    return {kg:roundKg(ex,extra),reps:slot.r2,cal:m.n<3,first,pf};
  }
  return {kg:roundKg(ex,goal/(1+(slot.r2+2)/30)),reps:slot.r2,cal:m.n<3,first,pf};
}
function liveKg(ex,slot,sets,k){
  if(ex.simple||ex.t==="kardio")return null;
  const b=bw();let best=0;sets.forEach((s,j)=>{if(j>=k||!s[4]||!s[1])return;const v=e1(loadOf(ex,s[0],b),+s[1],s[2]?RIR[s[2]]:2)*(1+.01*Math.min(j,3));if(v>best)best=v;});
  if(!best)return null;const load=best*.99/(1+(slot.r2+2)/30);
  if(ex.t==="telo")return null;
  return roundKg(ex,load);
}

function diagnose(name){
  const ex=EX[name];if(!ex||ex.simple||ex.t==="kardio")return null;const hist=[];
  for(const w of workouts()){const c=w.cviky.find(x=>x.n===name);if(c)hist.push({w,c,est:sessionEst(c,ex,w.bw||bw())});}
  const h=hist.slice(-4);if(h.length<2)return null;
  const below=h.filter(x=>x.c.t&&x.c.t.kg>0&&Math.max(...x.c.sets.map(s=>+s[0]))<x.c.t.kg-.01);
  const lowR=h.filter(x=>(x.c.r||1)<.95).length>=Math.ceil(h.length/2);
  const gaps=h.slice(1).map((x,i)=>(x.w.ts-h[i].w.ts)/864e5),gap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const falling=h.length>=3&&h[h.length-1].est<h[0].est*.98;
  if(below.length>=2){const tk=fmt(below[below.length-1].c.t.kg);
    if(falling&&lowR)return `Posledně ${below.length}× pod cílem (${tk} kg) a často unavený. Vypadá to na přetížení: dej lehčí týden, víc spánku a jídla.`;
    if(falling)return `Posledně ${below.length}× pod cílem (${tk} kg) a síla klesá. Appka stáhla cíl na tvou reálnou úroveň a staví znovu.`;
    return `Posledně ${below.length}× pod cílem (${tk} kg), ale síla se drží. Příště vezmi plnou cílovou váhu, máš na ni.`;}
  if(falling){if(lowR)return "Síla klesá a v těch dnech jsi byl unavený. Spíš přetížení než slabost.";
    if(gap>6)return `Síla klesá, mezi tréninky máš v průměru ${Math.round(gap)} dní. Pravidelnost pomůže víc než váha.`;
    return "Síla klesá bez jasné příčiny. Hlídej spánek a jídlo, appka zpomalila tempo.";}
  return null;
}

const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);};

let CRYPTO_KEY=null;
async function deriveKey(pass,saltB64){

}

async function setupKey(pass){ // nové heslo: sůl + kontrolní hodnota
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));const key=await deriveKey(pass,salt);
  LS.set("tr4_key",b64(await crypto.subtle.exportKey("raw",key)));CRYPTO_KEY=key;
  LS.set("tr4_keyfile",{salt,check:await encJSON({ok:1},key)});LS.set("tr4_keyfile_up",false);
}
async function unlockKey(pass,keyfile){
  const key=await deriveKey(pass,keyfile.salt);
  try{await decJSON(keyfile.check,key);}catch(e){return false;}
  LS.set("tr4_key",b64(await crypto.subtle.exportKey("raw",key)));CRYPTO_KEY=key;LS.set("tr4_keyfile",keyfile);LS.set("tr4_keyfile_up",true);return true;
}

async function sync(interactive){

  }

        if(byRid.klic){const kf=await (await g(`${API}/files/${byRid.klic.id}?alt=media`)).json();needPass=kf;syncState="needpass";renderStatus();return;}

      }

      else if(!byRid[id]){const m=multipart({name:fileName(r),parents:[fid],mimeType:"application/json",appProperties:{rid:id}},body);await g(`${UP}/files?uploadType=multipart&fields=id`,{method:"POST",...m});}
      unsynced.delete(id);saveDB();
    }

    let pulled=0;const key=await loadKey();

      const rid=f.appProperties&&f.appProperties.rid;if(!rid||rid==="klic")continue;
      if(rid!=="profil"&&DB[rid]&&!(DB[rid].typ==="den"&&new Date(f.modifiedTime).getTime()>DB[rid].ts+5000))continue;
      if(rid==="profil"&&PROFILE&&PROFILE.ts&&new Date(f.modifiedTime).getTime()<PROFILE.ts+5000)continue;
      try{let rec=await (await g(`${API}/files/${f.id}?alt=media`)).json();
        if(rec&&rec.enc){if(!key)continue;rec=await decJSON(rec,key);}
        if(!rec||!rec.id)continue;
        if(rid==="profil"){if(!PROFILE||(rec.data&&rec.data.ts>(PROFILE.ts||0))){PROFILE=rec.data;LS.set("tr4_profile",PROFILE);DB.profil=rec;pulled++;}}
        else{DB[rec.id]=rec;pulled++;}
      }catch(e){}
    }
    saveDB();LS.set("tr4_lastsync",Date.now());syncState="ok";
    if(pulled)render();
  }catch(e){
    if(e&&e.auth)syncState="needlogin";else{syncState="err";syncErr=(e&&e.message)||"Synchronizace selhala";}
  }
  renderStatus();
}

const OTHER={H1:"H2",H2:"H1",S1:"S2",S2:"S1",V1:"V2",V2:"V1"};
function doneSince(ts){const s=new Set();for(const w of workouts())if(w.ts>=ts)for(const c of w.cviky)if(c.sets.length)s.add(c.n);return s;}
// Vynechané partie: cvik z minulého tréninku stejné poloviny nahradí cvik na partii, která už je tento týden hotová.
function carryFor(tid){
  const none={add:[],drop:[]},o=OTHER[tid];if(!o)return none;
  const wk=Date.now()-7*864e5;if(!workouts().some(w=>w.trenink===o&&w.ts>=wk))return none;
  const done=doneSince(wk),hit=new Set();for(const n of done)if(EX[n])hit.add(EX[n].m[0]);
  const today=PROGRAM[tid].c,todayPrim=new Set(today.map(sl=>EX[slotEx(sl).n].m[0]));
  const add=PROGRAM[o].c.filter(sl=>{const n=slotEx(sl).n,p=EX[n].m[0];return !done.has(n)&&!hit.has(p)&&!todayPrim.has(p);}).slice(0,2);
  if(!add.length)return none;
  const cnt={};today.forEach(sl=>{const p=EX[slotEx(sl).n].m[0];cnt[p]=(cnt[p]||0)+1;});
  const score=sl=>{const p=EX[slotEx(sl).n].m[0];return (hit.has(p)?2:0)+(cnt[p]>1?1:0);};
  const drop=today.map((sl,i)=>[sl,i]).filter(([sl])=>score(sl)>0).sort((x,y)=>score(y[0])-score(x[0])||y[1]-x[1]).slice(0,add.length).map(x=>x[0].id);
  return {add:drop.length?add.slice(0,drop.length):add.slice(0,1),drop};
}
function newDraft(tid,back){
  const P=PROGRAM[tid],cf=back?{add:[],drop:[]}:carryFor(tid);
  const list=P.c.filter(sl=>!cf.drop.includes(sl.id));
  for(const sl of cf.add.slice().reverse()){if(ISO.has(EX[slotEx(sl).n].pat))list.splice(1,0,sl);else list.unshift(sl);}
  const ret=P.mode==="gym"&&!back&&daysSinceMode("gym")>14&&workouts().some(w=>PROGRAM[w.trenink]&&PROGRAM[w.trenink].mode==="gym");
  draft={v4:1,tid,back:back||null,started:null,lastSetAt:null,stav:{energie:2,bolest:{},ok:!!back},ret,
    carry:cf.add.map(s=>s.id),dropped:cf.drop,slots:list.map(sl=>({id:sl.id,n:slotEx(sl).n})),sets:[],targets:[]};
  replan(true);return draft;

const slotOf=id=>{for(const k in PROGRAM)for(const sl of PROGRAM[k].c)if(sl.id===id)return sl;return null;};
function replan(all){
  const d=draft,R=(d.stav.lehci?.95:1)*(d.ret?.9:1);
  d.targets=d.slots.map(s=>targetFor(EX[s.n],slotOf(s.id),R));

    const sl=slotOf(s.id);
    if(!d.sets[i])d.sets[i]=Array.from({length:sl.s},()=>[d.targets[i].kg,"","",false,false]);
    d.sets[i].forEach(x=>{if(!x[3]&&!x[4]&&(x[1]===""||all))x[0]=d.targets[i].kg;});
    relive(i);

function barChart(v){

  for(const g of [0,2,4])o+=`<line x1="24" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="18" y="${y(g)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${g}</text>`;
  o+=`<line x1="24" x2="${W}" y1="${y(4)}" y2="${y(4)}" stroke="var(--plate-green)" stroke-dasharray="4 3" stroke-width="1.5"/>`;
  v.forEach((n,i)=>{const x=30+i*(bw_+gap);o+=`<rect x="${x}" y="${y(n)}" width="${bw_}" height="${Math.max(0,H-22-y(n))}" rx="3" fill="${i===v.length-1?"var(--accent)":"var(--fig-eq)"}"/><text x="${x+bw_/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${i===v.length-1?"teď":"−"+(v.length-1-i)}</text>`;});

function lineChart(p){

  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj v čase">`;
  for(const g of [mn,(mn+mx)/2,mx])o+=`<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(g)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(g)}</text>`;
  const d=p.map((q,i)=>(i?"L":"M")+X(q.t).toFixed(1)+" "+Y(q.v).toFixed(1)).join(" ");
  o+=`<path d="${d} L${X(t1)} ${H-B} L${L} ${H-B} Z" fill="var(--accent)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="${X(t1)}" cy="${Y(p[p.length-1].v)}" r="4" fill="var(--accent)"/>`;

async function validateStep(p,step){
  if(step===0&&!p.jmeno)return "Napiš jméno.";
  if(step===1&&p.uloziste==="google"&&!CLIENT_ID)return "Google Disk zatím nejde, vyber telefon.";
  if(step===1&&p.uloziste==="google"&&p.sifrovat&&!LS.get("tr4_key",null)){
    const a=document.getElementById("f-pass1"),b=document.getElementById("f-pass2");if(!a)return "";
    if(a.value.length<8)return "Heslo musí mít aspoň 8 znaků.";if(a.value!==b.value)return "Hesla se neshodují.";
    await setupKey(a.value);}
  if(step===2&&!(p.vaha>30&&p.vaha<250))return "Zadej váhu v kg.";
  if(step===3&&!p.kotouce.length)return "Vyber aspoň jeden kotouč.";

// obnova na novém zařízení (počítač, nový telefon): přihlásit Googlem a stáhnout všechno z Disku
async function restoreFromDrive(pass){
  const q=encodeURIComponent("name = 'Trénink' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
  const fl=(await (await g(`${API}/files?q=${q}&fields=files(id)`)).json()).files||[];
  if(!fl.length)throw new Error("Na tomhle Google účtu jsem nenašel složku Trénink. Přihlásil ses stejným účtem jako v telefonu?");
  let found=null;
  for(const f of fl){const rem=await listRemote(f.id),by={};rem.forEach(x=>{const rid=x.appProperties&&x.appProperties.rid;if(rid)by[rid]=x;});if(by.profil){found={fid:f.id,by,n:rem.length};break;}}
  if(!found)throw new Error("Složka Trénink na Disku je, ale nejsou v ní tvoje data. Zálohuj nejdřív v telefonu (Profil → Zálohovat teď).");
  let rec=await (await g(`${API}/files/${found.by.profil.id}?alt=media`)).json();
  if(rec&&rec.enc){
    if(!(await loadKey())){
      if(!found.by.klic)throw new Error("Data jsou zašifrovaná, ale na Disku chybí klíč.");
      if(!pass)return {needPass:true};
      const kf=await (await g(`${API}/files/${found.by.klic.id}?alt=media`)).json();
      if(!(await unlockKey(pass,kf)))return {needPass:true,bad:true};
    }
    rec=await decJSON(rec,await loadKey());
  }
  if(!rec||!rec.data)throw new Error("Profil na Disku se nepodařilo přečíst.");
  PROFILE=rec.data;LS.set("tr4_profile",PROFILE);DB.profil=rec;saveDB();LS.set("tr4_folder",found.fid);
  return {ok:true,n:found.n};
}

  const out=document.getElementById("rsOut");if(!out)return;

}

function weightTrend(){ // kg za týden z posledních 4 týdnů
  const w=weighins().filter(x=>x.ts>Date.now()-35*864e5);if(w.length<2)return null;
  const span=(w[w.length-1].ts-w[0].ts)/864e5;if(span<13)return null;return (w[w.length-1].kg-w[0].kg)/span*7;
}
function targets(){
  const p=PROFILE||{},kg=bw(),h=+p.vyska||178,a=+p.vek||30,mode=curMode();
  const bmr=10*kg+6.25*h-5*a+(p.pohlavi==="z"?-161:5),act=mode==="bw"?1.75:1.55;
  let kcal=bmr*act+({nabrat:300,udrzet:0,zhubnout:-450}[p.cil||"nabrat"]),note="";
  const tr=weightTrend();
  if(tr!==null){
    if((p.cil||"nabrat")==="nabrat"){if(tr<.1){kcal+=150;note="Váha neroste, přidávám 150 kcal.";}else if(tr>.5){kcal-=150;note="Váha roste moc rychle, ubírám 150 kcal.";}}
    if(p.cil==="zhubnout"&&tr>-.2){kcal-=150;note="Váha neklesá, ubírám 150 kcal.";}
  }
  const b=kg*({nabrat:2,udrzet:1.8,zhubnout:2.2}[p.cil||"nabrat"]),t=kg*.9,s=Math.max(0,(kcal-b*4-t*9)/4);
  return {kcal:Math.round(kcal/10)*10,b:Math.round(b),t:Math.round(t),s:Math.round(s),voda:Math.round((kg*35+(mode==="bw"?1000:0))/250)*250,note,tr};
}

let scanStream=null,scanRAF=null;
function stopScan(){if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}
async function startScan(){
  const box=document.getElementById("scanBox");
  if(!("BarcodeDetector" in window)){box.innerHTML=`<div class="hint" style="color:var(--warn)">Tenhle prohlížeč kódy číst neumí. Otevři appku v Chromu, nebo napiš číslo pod kódem.</div>`;return;}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});}catch(e){box.innerHTML=`<div class="hint" style="color:var(--warn)">Kameru se nepodařilo zapnout. Povol appce kameru v nastavení prohlížeče.</div>`;return;}
  box.innerHTML=`<video id="scanV" playsinline muted class="scanv"></video><button class="mini" id="scanStop">Zastavit</button>`;
  const v=document.getElementById("scanV");v.srcObject=scanStream;await v.play();
  document.getElementById("scanStop").onclick=()=>{stopScan();box.innerHTML="";};
  const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  const loop=async()=>{if(!scanStream)return;try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;stopScan();box.innerHTML="";if(navigator.vibrate)navigator.vibrate(80);lookupCode(c);return;}}catch(e){}scanRAF=requestAnimationFrame(loop);};
  loop();
}

    const j=await r.json();if(j.status===1&&j.product){const p=j.product,n=p.nutriments||{},sq=+p.serving_quantity||0;
      const g=k=>n[k+"_100g"]!=null?+n[k+"_100g"]:(sq&&n[k+"_serving"]!=null?+n[k+"_serving"]*100/sq:null);
      const kc=n["energy-kcal_100g"]??(n.energy_100g?n.energy_100g/4.184:null)??(sq&&n["energy-kcal_serving"]!=null?n["energy-kcal_serving"]*100/sq:null);
      v={code,n:[p.product_name_cs||p.product_name||p.product_name_pl||p.product_name_de,p.brands&&p.brands.split(",")[0]].filter(Boolean).join(" · "),

      fMsg="";

        <label class="btn">Vyfotit tabulku<input type="file" id="ocrIn" accept="image/*" capture="environment" hidden></label><div id="ocrOut"></div>
        <div class="hint">Nebo hodnoty opiš:</div><div id="nfWrap">${newFoodForm(v)}</div>`;bindFood2();return;}
      box.innerHTML=`<div class="hint" style="color:var(--ok)">Nalezeno v Open Food Facts. Zkontroluj a ulož.</div>`+newFoodForm(v);bindFood2();return;}}catch(e){}}

    <label class="btn">Vyfotit tabulku<input type="file" id="ocrIn" accept="image/*" capture="environment" hidden></label><div id="ocrOut"></div><div id="nfWrap">${newFoodForm(v)}</div>`;bindFood2();
}

let tessLoading=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();if(tessLoading)return tessLoading;
  tessLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=res;s.onerror=()=>{tessLoading=null;rej();};document.head.appendChild(s);});return tessLoading;}
// Čte tabulku výživových hodnot. Nejdřív podle názvů řádků (CZ/DE/EN/PL/FR), když chybí, podle pevného pořadí EU tabulky:
// energie, tuky, z toho nasycené, sacharidy, z toho cukry, (vláknina), bílkoviny, sůl. Vybere pořadí, které nejlíp sedí na kalorie.
function parseLabel(txt){
  const t=txt.toLowerCase().replace(/(\d),(\d)/g,"$1.$2").replace(/[ \t]+/g," ");
  const num="(\\d{1,3}(?:\\.\\d{1,2})?)";
  const kw=(words)=>{const m=t.match(new RegExp("(?:"+words+")[^\\d\\n]{0,30}"+num));return m?parseFloat(m[1]):null;};
  let kcal=null;const km=t.match(/(\d{2,4}(?:\.\d)?)\s*kcal/);if(km)kcal=parseFloat(km[1]);
  const r={kcal,b:kw("b[ií]lkoviny|bielkoviny|eiwei(?:ß|ss)|protein[a-z]*|bia[lł]ko|prot[ée]ines|proteine|prote[ií]nas|feh[ée]rje|eiwitten"),
    s:kw("sacharidy|kohlenhydrate|carbohydrate[s]?|w[ęe]glowodany|glucides|carboidrati|hidratos|sz[ée]nhidr[áa]t|koolhydraten"),
    t:kw("(?:^|\\n)\\s*(?:tuky|tuk|fett|fat|t[łl]uszcz|mati[èe]res grasses|lipides|grassi|grasas|zs[ií]r|vetten)"),sugar:kw("cukry|zucker|sugars|sucres|zuccheri|az[úu]cares|cukrok|cukor|suikers"),
    sat:kw("nasycen[éeá]|gesättigte|ges[aä]ttigte|saturates|nasycone|satur[ée]s|saturi|saturados|tel[ií]tett|verzadigde"),
    fiber:kw("vl[áa]knina|ballaststoffe|fibre|fiber|b[łl]onnik|fibres|fibra|rost\\b|vezels"),salt:kw("s[ůu]l\\b|so[ľl]\\b|salz|salt|s[óo]l\\b|sel\\b|sale|sal\\b|s[óo]\\b|zout")};
  const have=["b","s","t"].filter(k=>r[k]!=null).length;
  if(have>=3||kcal==null)return r;
  // podle pořadí: první číslo s "g" na každém řádku za prvním řádkem s kcal; zkusí všechny kcal a posuny
  const lines=t.split("\n"),ki=lines.findIndex(l=>/kcal/.test(l)),vals=[];
  for(const l of lines.slice(ki)){const m=l.replace(/\d{2,4}(?:\.\d)?\s*kcal/g,"").match(/(\d{1,3}(?:\.\d{1,2})?)\s*g\b/);if(m)vals.push(parseFloat(m[1]));if(vals.length>=11)break;}
  const kcals=[...t.matchAll(/(\d{2,4}(?:\.\d)?)\s*kcal/g)].map(m=>parseFloat(m[1]));

    const b=solvePlan(null,avoid,d);p={v:2,pick:b.pick,k:b.k,locked:{}};LS.set("tr4_plan_"+d,p);}

}

let rTimers={},rHave=new Set();
function stopTimers(){Object.values(rTimers).forEach(t=>clearInterval(t.iv));rTimers={};}
function startTimer(btn){
  const i=btn.dataset.tmr,min=+btn.dataset.min;
  if(rTimers[i]){clearInterval(rTimers[i].iv);delete rTimers[i];btn.textContent=`Minutka ${min} min`;btn.classList.remove("run","ok");return;}
  const end=Date.now()+min*60e3;btn.classList.add("run");btn.classList.remove("ok");
  const tick=()=>{const left=Math.max(0,Math.round((end-Date.now())/1000));
    if(!document.body.contains(btn)){clearInterval(rTimers[i]&&rTimers[i].iv);delete rTimers[i];return;}
    if(left<=0){clearInterval(rTimers[i].iv);delete rTimers[i];btn.textContent="Hotovo, čas vypršel";btn.classList.remove("run");btn.classList.add("ok");if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);return;}
    btn.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}  ·  klepni = stop`;};
  rTimers[i]={iv:setInterval(tick,1000)};tick();
}

/* ---------- obchody v okolí (OpenStreetMap) ---------- */
const place=()=>LS.get("tr4_place",null);
async function findShops(){
  if(!navigator.geolocation)throw new Error("Telefon neposkytl polohu");
  if(!navigator.onLine)throw new Error("Hledání obchodů potřebuje internet");
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,()=>rej(new Error("Polohu se nepodařilo zjistit. Povol appce polohu.")),{enableHighAccuracy:false,timeout:15000,maximumAge:600000}));
  const {latitude:lat,longitude:lon}=pos.coords;
  const q=`[out:json][timeout:15];(node["shop"~"supermarket|convenience|discount"](around:2000,${lat},${lon});way["shop"~"supermarket|convenience|discount"](around:2000,${lat},${lon}););out center 40;`;
  const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
  const j=await r.json();
  const dist=(a,b)=>{const R=6371e3,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t,x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
  const seen=new Set(),shops=(j.elements||[]).map(e=>{const c=e.center||e;return {n:(e.tags&&(e.tags.brand||e.tags.name))||"Obchod",d:Math.round(dist({lat,lon},{lat:c.lat,lon:c.lon}))};})
    .sort((a,b)=>a.d-b.d).filter(s=>{if(seen.has(s.n))return false;seen.add(s.n);return true;}).slice(0,6);
  let cc=lat>47&&lat<55.1&&lon>5.8&&lon<15.1&&!(lat>48.5&&lat<51.1&&lon>12.1)?"de":"cz";
  try{const g=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=3&lat=${lat}&lon=${lon}`)).json();if(g.address&&g.address.country_code)cc=g.address.country_code;}catch(e){}
  const p={date:todayISO(),lat,lon,cc,shops};LS.set("tr4_place",p);return p;
}
function shopsLine(){

  if(!p||p.date!==todayISO())return `<div class="row between"><span class="hint">Kde dnes nakoupíš?</span><button class="arrow wide" data-findshops>Najít obchody v okolí</button></div>`;
  return `<div class="row between" style="flex-wrap:nowrap"><span class="hint">${p.shops.length?"Nejblíž: "+p.shops.slice(0,3).map(s=>`${s.n} ${s.d<1000?s.d+" m":fmt(Math.round(s.d/100)/10)+" km"}`).join(", "):"Do 2 km jsem nenašel obchod."}</span><button class="arrow" data-findshops aria-label="Hledat znovu">↻</button></div>`;
}

/* ---------- rady: čeho dnes víc a čeho míň ---------- */
function insightsHTML(tot,T,d){
  const out=[],h=new Date().getHours(),isToday=d===todayISO(),late=isToday&&h>=18;
  const gapB=T.b-tot.b,gapK=T.kcal-tot.kcal;
  if(gapB>15){const opts=[["Tvaroh polotučný",250],["Skyr bílý",280],["Protein (odměrka)",30],["Šunka 95 % masa",100],["Kuřecí prsa",200]].map(([n,g])=>{const f=FOODS.find(x=>x.n===n);return {n,g,b:f.b*g/100,k:f.kcal*g/100};}).filter(o=>o.k<=gapK+150).slice(0,2);
    out.push(["Bílkovin víc",`chybí ${Math.round(gapB)} g. ${opts.length?"Nejsnáz: "+opts.map(o=>`${o.n.toLowerCase()} ${o.g} g (+${Math.round(o.b)} g)`).join(" nebo ")+".":""}`,"pro"]);}
  if(gapK>600&&late)out.push(["Kalorií víc",`ještě ${Math.round(gapK)} kcal. Při nabírání je nevynechávej: přidej přílohu (rýže, brambory) nebo chléb s arašídovým máslem.`,""]);
  else if(gapK<-250)out.push(["Kalorií míň",`jsi ${Math.round(-gapK)} kcal nad cílem. Jeden den nevadí, zítra drž plán.`,"over"]);
  if(tot.t>T.t*1.15)out.push(["Tuků míň",`máš ${Math.round(tot.t)} g z ${T.t} g. Zbytek dne bez sýrů, ořechů a majonézy.`,"t"]);
  if(curMode()==="gym"&&!late&&tot.s<T.s*.4&&isToday)out.push(["Sacharidů víc",`před tréninkem přidej banán, rýži nebo vločky, budeš mít víc síly.`,"s"]);
  const r=dayRec(d);if(isToday&&h>=14&&r.voda<T.voda*.4)out.push(["Vody víc",`máš ${fmt(r.voda/1000)} l z ${fmt(T.voda/1000)} l. Dej si teď 2 sklenice.`,"pro"]);
  if(tot.caf>300)out.push(["Kofeinu míň",`asi ${Math.round(tot.caf)} mg. Odpoledne už bez energeťáků, ať se dobře vyspíš.`,"over"]);
  if(!out.length&&tot.kcal>0)out.push(["Jde ti to",gapK>0?`zbývá ${Math.round(gapK)} kcal${gapB>0?` a ${Math.round(gapB)} g bílkovin`:""}.`:"cíle na dnes máš splněné.",""]);
  if(!out.length)return "";
  return `<section class="card"><b>Čeho dnes víc a čeho míň</b><div class="hist">${out.map(([t,x,c])=>`<div class="it" style="align-items:flex-start;justify-content:flex-start;gap:12px"><i class="tag ${c}"></i><span><b>${t}:</b> ${x}</span></div>`).join("")}</div></section>`;
}

async function judgeCode(code){

    if(j.status===1&&j.product){const p=j.product,n=p.nutriments||{},sq=+p.serving_quantity||0;
      const g=k=>n[k+"_100g"]!=null?+n[k+"_100g"]:(sq&&n[k+"_serving"]!=null?+n[k+"_serving"]*100/sq:null);
      if(n["energy-kcal_100g"]==null&&n.energy_100g==null&&sq&&n["energy-kcal_serving"]!=null)n["energy-kcal_100g"]=+n["energy-kcal_serving"]*100/sq;
      ["proteins","carbohydrates","fat","sugars","saturated-fat","salt","fiber"].forEach(k=>{if(n[k+"_100g"]==null&&g(k)!=null)n[k+"_100g"]=g(k);});
      v={code,n:[p.product_name_cs||p.product_name,p.brands&&p.brands.split(",")[0]].filter(Boolean).join(" · ")||"Výrobek "+code,
      kcal:+(n["energy-kcal_100g"]??(n.energy_100g?n.energy_100g/4.184:0)),b:+(n.proteins_100g||0),s:+(n.carbohydrates_100g||0),t:+(n.fat_100g||0),sugar:n.sugars_100g,sat:n["saturated-fat_100g"],salt:n.salt_100g,fiber:n.fiber_100g,ns:p.nutriscore_grade,nova:p.nova_group,ug:+p.serving_quantity||0,cats:(p.categories_tags||[]).join(" ")};}}catch(e){}}
  if(!v&&local)v={code,n:local.n,kcal:local.kcal,b:local.b,s:local.s,t:local.t};
  if(v&&!(v.kcal>0))v.missing=true;
  if(!v){out.innerHTML=`<div class="hint" style="color:var(--warn)">${navigator.onLine?"Výrobek v databázi není.":"Bez internetu ho neposoudím."} Podívej se na obal: dobrá volba má hodně bílkovin a málo cukru.</div>`;return;}

}

    ${v.src==="foto"?`<div class="hint">Hodnoty jsem přečetl z fotky. Když nesedí, oprav je.</div>`:""}

async function importCSV(file){

  if(hi<0){out.innerHTML=`<div class="hint" style="color:var(--warn)">Ve výpisu jsem nenašel sloupce datum a částka. Pošli mi, z jaké banky je, a doplním ho.</div>`;return;}
  const delim=[";",",","\t"].sort((a,b)=>lines[hi].split(b).length-lines[hi].split(a).length)[0];
  const split=l=>{const r=[];let cur="",q=false;for(const ch of l){if(ch==='"'){q=!q;continue;}if(ch===delim&&!q){r.push(cur);cur="";}else cur+=ch;}r.push(cur);return r.map(x=>x.trim());};
  const head=split(lines[hi]).map(h=>h.toLowerCase());
  const col=re=>head.findIndex(h=>re.test(h));
  const cD=col(/datum|date|buchung/),cA=col(/částka|castka|objem|amount|betrag|suma/),cC=col(/měna|mena|currency|währung/);
  const cN=[col(/zpráva|zprava|popis|poznámka|poznamka|description|verwendung|message/),col(/protistrana|název protiúčtu|nazev protiuctu|obchodník|obchodnik|merchant|empfänger|payee|counterparty/),col(/typ|type/)].filter(i=>i>=0);
  let added=0,skipped=0;const have=new Set(records().filter(r=>r.typ==="vydaj").map(r=>r.hash));
  for(const l of lines.slice(hi+1)){
    const c=split(l);if(c.length<head.length-1)continue;
    let a=c[cA]||"";a=parseFloat(a.replace(/\s/g,"").replace(/ /g,"").replace(",","."));if(!(a<0))continue;

    const cur=cC>=0&&/eur/i.test(c[cC])?"€":"Kč",hash=d+"|"+a+"|"+note;

  }

function bindMealPhoto(box,file,meal,done){

    try{const r=await saveFoodPhoto(file,document.getElementById("mpName").value.trim(),meal);sync(false);done(r);}
    catch(e){b.disabled=false;b.textContent="Uložit jídlo";box.insertAdjacentHTML("beforeend",`<div class="hint" style="color:var(--warn)">Fotku se nepodařilo uložit: ${e.message}</div>`);}};

function photoMsg(r){const e=DB[r.id];if(!e)return "";
  if(!e.pending)return `Zapsáno: ${e.name}, cca ${Math.round(e.kcal)} kcal a ${Math.round(e.b)} g bílkovin (odhad AI${e.ai&&e.ai.jistota?", jistota "+e.ai.jistota:""}).`;

  return aiReady()?"Fotka uložena, AI ji odhadne, až budeš online.":"Fotka uložena. Hodnoty doplň ťuknutím na jídlo v deníku, nebo si v Profilu zapni AI.";

let qaMode=null,qaQ="",qaSel=null,qaN=1,qaOn=[],qaBusy=false,qaMsg="",qaUndo=null,qaT=null,qaErr="",qaList=[];
const qaCache=new Map();
const OFF_FIELDS="code,product_name,product_name_cs,product_name_pl,product_name_de,brands,quantity,serving_quantity,image_front_small_url,nutriments";
function offToFood(p){
  const n=p.nutriments||{},sq=+p.serving_quantity||0,qm=String(p.quantity||"").replace(",",".").match(/([\d.]+)\s*(ml|kg|g|l)\b/i);
  const qg=qm?parseFloat(qm[1])*(/^(l|kg)$/i.test(qm[2])?1000:1):0,ml=!!qm&&/^(ml|l)$/i.test(qm[2]);
  const g=k=>n[k+"_100g"]!=null?+n[k+"_100g"]:(sq&&n[k+"_serving"]!=null?+n[k+"_serving"]*100/sq:null);
  const kc=n["energy-kcal_100g"]??(n.energy_100g?n.energy_100g/4.184:null)??(sq&&n["energy-kcal_serving"]!=null?n["energy-kcal_serving"]*100/sq:null);
  const u=qg>0&&qg<=600?[ml?"balení":"ks",Math.round(qg)]:sq?["porce",Math.round(sq)]:["100 g",100];
  return {id:"c:"+p.code,code:String(p.code),n:[p.product_name_cs||p.product_name||p.product_name_pl||p.product_name_de,p.brands&&p.brands.split(",")[0]].filter(Boolean).join(" · ")||"Výrobek "+p.code,
    kcal:kc>0?Math.round(kc):0,b:+(+g("proteins")||0).toFixed(1),t:+(+g("fat")||0).toFixed(1),s:+(+g("carbohydrates")||0).toFixed(1),u,ml,img:p.image_front_small_url||"",off:1,missing:!(kc>0),mc:ml?"piti":"jidlo"};
}
function qaLocal(q){
  const terms=norm(q).split(/[^a-z0-9]+/).filter(Boolean).map(stem);if(!terms.length)return [];
  const used=new Map();records().filter(r=>r.typ==="jidlo").forEach(e=>used.set(e.fid,(used.get(e.fid)||0)+1));
  return allFoods().filter(f=>{const w=norm(f.n).split(/[^a-z0-9]+/);return terms.every(t=>w.some(x=>x.startsWith(t)));})
    .sort((a,b)=>(used.get(b.id)||0)-(used.get(a.id)||0)).slice(0,6);
}
function qaSearch(q){ // Open Food Facts: nejdřív výrobky prodávané v ČR (v Německu DE), když je jich málo, celý svět
  clearTimeout(qaT);qaErr="";const key=norm(q).trim();
  if(key.length<3||!navigator.onLine){qaOn=[];qaBusy=false;return;}
  if(qaCache.has(key)){qaOn=qaCache.get(key);qaBusy=false;return;}
  qaBusy=true;qaOn=[];
  qaT=setTimeout(async()=>{
    const url=h=>`https://${h}.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q.trim())}&search_simple=1&action=process&json=1&page_size=12&sort_by=unique_scans_n&fields=${OFF_FIELDS}`;
    try{let ps=((await (await fetch(url(curMode()==="bw"?"de":"cz"))).json()).products)||[];
      if(ps.length<4){const seen=new Set(ps.map(p=>p.code)),more=((await (await fetch(url("world"))).json()).products)||[];ps=ps.concat(more.filter(p=>!seen.has(p.code)));}
      const res=ps.filter(p=>p.code&&(p.product_name||p.product_name_cs||p.product_name_pl||p.product_name_de)).map(offToFood).slice(0,12);
      qaCache.set(key,res);if(norm(qaQ).trim()===key){qaOn=res;qaBusy=false;qaRender();}}
    catch(e){if(norm(qaQ).trim()===key){qaBusy=false;qaErr="Online hledání teď nejde. Zkus čárový kód nebo foto tabulky.";qaRender();}}
  },650);
}
const qaThumb=f=>f.img?`<img src="${f.img}" alt="" loading="lazy">`:`<i class="qini">${(f.n||"?")[0].toUpperCase()}</i>`;
const qaUnitKcal=f=>Math.round(f.kcal*f.u[1]/100);
function qaLastPrice(f){const l=records().filter(r=>r.typ==="jidlo"&&r.fid===f.id&&r.price).pop();return l?Math.round(l.price*f.u[1]/l.g*10)/10:(f.price||"");}

      <div class="grid2">${field("qa-g",f.u[0]==="100 g"?"Jednotka ("+u+")":"1 "+f.u[0]+" má ("+u+")",f.u[1])}${field("qa-price","Cena za "+(f.u[0]==="100 g"?"100 "+u:"1 "+f.u[0])+" ("+curSym()+")",pr)}</div>

  if(qaQ.trim()){
    const loc=qaLocal(qaQ),codes=new Set(loc.map(f=>f.code).filter(Boolean)),on=qaOn.filter(f=>!codes.has(f.code)&&!(DB[f.id]&&!DB[f.id].del));
    qaList=[...loc,...on];
    return `<div class="qres">${qaList.map((f,i)=>`<button class="qrow" data-qa="${i}">${qaThumb(f)}<span><span class="qn">${f.n}</span><span class="hint">${f.missing?"chybí hodnoty, doplníš z fotky":`${qaUnitKcal(f)} kcal / ${f.u[0]==="100 g"?"100 "+(f.ml?"ml":"g"):f.u[0]}`}${f.off?"":" · tvoje"}</span></span></button>`).join("")}</div>
      ${qaBusy?`<div class="hint">Hledám v databázi výrobků…</div>`:""}${qaErr?`<div class="hint" style="color:var(--warn)">${qaErr}</div>`:""}
      ${!qaList.length&&!qaBusy?`<div class="empty">${norm(qaQ).trim().length<3?"Piš dál…":"Nic jsem nenašel. Naskenuj čárový kód nebo vyfoť tabulku."}</div>`:""}`;}
  if(qaMsg)return `<div class="row between" style="flex-wrap:nowrap"><span class="hint" style="color:var(--ok)">${qaMsg}</span>${qaUndo?`<button class="mini" id="qaUndo">Vrátit</button>`:""}</div>`;
  return `<div class="hint">Napiš pár písmen, naskenuj kód nebo vyfoť obal. Zapíše se do jídla i výdajů.</div>`;
}
function qaRender(){const b=document.getElementById("qaBody");if(!b)return;b.innerHTML=qaBodyHTML();qaBind();}
async function toFoodAdd(fn){location.hash="#jidlo";await new Promise(r=>setTimeout(r,80));openAdd(mealNow());await fn();}
async function qaFetchCode(code){
  const loc=allFoods().find(f=>f.code===code);if(loc)return loc;
  if(!navigator.onLine)return {id:"c:"+code,code,n:"Výrobek "+code,missing:1,u:["100 g",100],kcal:0,b:0,t:0,s:0};
  try{const j=await (await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`)).json();if(j.status===1&&j.product)return offToFood({...j.product,code});}catch(e){}
  return {id:"c:"+code,code,n:"Výrobek "+code,missing:1,u:["100 g",100],kcal:0,b:0,t:0,s:0};
}

  const tab=document.getElementById("qaTab");if(tab)tab.onchange=()=>{const file=tab.files[0],code=qaSel.code;if(!file)return;qaSel=null;toFoodAdd(async()=>{fTab="kod";renderFood();if(code)await lookupCode(code);else{fTab="foto";renderFood();}readLabel(file);});};
  const nn=document.getElementById("qaNn");if(!nn)return;const f=qaSel;
  const sum=()=>{const n=+nn.value||0,g=(+num("qa-g")||f.u[1])*n,pr=(+num("qa-price")||0)*n;
    document.getElementById("qaSum").textContent=`Celkem ${fmt(Math.round(g))} ${f.ml?"ml":"g"} · ${Math.round(f.kcal*g/100)} kcal · ${Math.round(f.b*g/100)} g bílkovin${pr?" · "+money(pr):""}`;};
  document.getElementById("qaM").onclick=()=>{nn.value=Math.max(1,(+nn.value||1)-1);qaN=+nn.value;sum();};
  document.getElementById("qaP").onclick=()=>{nn.value=(+nn.value||0)+1;qaN=+nn.value;sum();};
  ["qaNn","qa-g","qa-price"].forEach(id=>document.getElementById(id).oninput=()=>{qaN=+nn.value||1;sum();});sum();
  document.getElementById("qaGo").onclick=()=>{
    const n=+nn.value||1,unit=+num("qa-g")||f.u[1],pr=+num("qa-price")||0,now=Date.now();
    let food=f;
    if(f.off&&!DB[f.id]){food={v:4,typ:"potravina",id:f.id,ts:now,n:f.n,kcal:f.kcal,b:f.b,t:f.t,s:f.s,u:[f.u[0],unit],ml:f.ml,mc:f.mc,price:pr,code:f.code,img:f.img};addRecord(food);}
    fDate=null;const rec=logFoodRaw(food,unit*n,mealNow(),pr*n,curSym(),null);

}

/* ---------- pohyb mimo trénink: jdu kolem parku a dám 20 shybů ---------- */
const MOVES=[["Kliky","kliků"],["Shyby","shybů"],["Dřepy","dřepů"],["Dipy","dipů"],["Výpady","výpadů"],["Sklapovačky","sklapovaček"],["Plank","s planku",1],["Burpees","burpees"]];
let mvSel=null,mvMsg="",mvUndo=null,mvOwn=false;
const mvWord=n=>{const m=MOVES.find(x=>x[0]===n);return m?m[1]:n.toLowerCase();};
function moveHTML(){
  const t=todayISO(),all=mikros(),list=all.filter(r=>r.date===t),by={};list.forEach(r=>by[r.n]=(by[r.n]||0)+r.reps);
  const own=[...new Set(all.map(r=>r.n).filter(n=>!MOVES.some(m=>m[0]===n)))].slice(-4);
  const names=[...MOVES.map(m=>m[0]),...own];
  let body="";
  if(mvSel){const last=all.filter(r=>r.n===mvSel).pop(),sec=(MOVES.find(m=>m[0]===mvSel)||[])[2],q=sec?[30,45,60,90]:[10,15,20,30,50];
    body=`<div class="grp"><span class="lbl">${mvSel}: kolik ${sec?"sekund":"opakování"}</span>
      <div class="quick">${q.map(v=>`<button class="qf" data-mvq="${v}">${v}${sec?" s":""}</button>`).join("")}${last&&!q.includes(last.reps)?`<button class="qf" data-mvq="${last.reps}">${last.reps}${sec?" s":""}<span>minule</span></button>`:""}</div>
      <div class="bwrow"><input type="number" inputmode="numeric" id="mvIn" placeholder="${last?last.reps:sec?45:20}" aria-label="Počet"><button class="mini" id="mvGo">Zapsat</button><button class="mini" id="mvX">Zrušit</button></div></div>`;}
  else if(mvOwn)body=`<div class="bwrow"><input type="text" id="mvName" placeholder="Název cviku, třeba Pistol dřep" aria-label="Název cviku" style="flex:1;max-width:none"><button class="mini" id="mvOwnGo">Dál</button></div>`;
  return `<section class="card" id="mvCard" style="--accent:var(--plate-red)"><div class="row between"><span class="lbl">Pohyb mimo trénink</span><span class="hint">${Object.keys(by).length?"dnes":""}</span></div>
    ${Object.keys(by).length?`<div><b>${Object.entries(by).map(([n,v])=>`${v} ${mvWord(n)}`).join(" · ")}</b></div>`:`<div class="hint">Jdeš kolem hrazdy? Dej pár shybů a zapiš je jedním klepnutím.</div>`}
    <div class="quick hscroll">${names.map(n=>`<button class="qf" data-mv="${encodeURIComponent(n)}" aria-pressed="${mvSel===n}">${n}</button>`).join("")}<button class="qf" id="mvOwnBtn">+ Jiný cvik</button></div>
    ${body}${mvMsg?`<div class="row between" style="flex-wrap:nowrap"><span class="hint" style="color:var(--ok)">${mvMsg}</span>${mvUndo?`<button class="mini" id="mvUndo">Vrátit</button>`:""}</div>`:""}</section>`;
}
function bindMove(){
  const re=()=>{const c=document.getElementById("mvCard");if(c){c.outerHTML=moveHTML();bindMove();}};
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const n=decodeURIComponent(b.dataset.mv);mvSel=mvSel===n?null:n;mvOwn=false;mvMsg="";re();const i=document.getElementById("mvIn");if(i)i.focus();});
  const ob=document.getElementById("mvOwnBtn");if(ob)ob.onclick=()=>{mvOwn=!mvOwn;mvSel=null;re();const i=document.getElementById("mvName");if(i)i.focus();};
  const og=document.getElementById("mvOwnGo");if(og)og.onclick=()=>{const v=document.getElementById("mvName").value.trim();if(!v)return;mvOwn=false;mvSel=v[0].toUpperCase()+v.slice(1);re();};
  const save=v=>{if(!(v>0))return;const now=Date.now(),r={v:4,typ:"mikro",id:"m"+now,ts:now,date:todayISO(),n:mvSel,reps:Math.round(v)};addRecord(r);sync(false);
    const sec=(MOVES.find(m=>m[0]===mvSel)||[])[2];mvMsg=`Zapsáno: ${r.reps}${sec?" s":""} ${sec?"planku":mvWord(mvSel)}.`;mvUndo=r.id;mvSel=null;re();};
  document.querySelectorAll("[data-mvq]").forEach(b=>b.onclick=()=>save(+b.dataset.mvq));
  const g=document.getElementById("mvGo");if(g)g.onclick=()=>{const i=document.getElementById("mvIn");save(parseInt(i.value||i.placeholder));};
  const x=document.getElementById("mvX");if(x)x.onclick=()=>{mvSel=null;re();};
  const u=document.getElementById("mvUndo");if(u)u.onclick=()=>{if(DB[mvUndo])addRecord({...DB[mvUndo],del:true,ts:Date.now()});mvUndo=null;mvMsg="Vráceno.";sync(false);re();};
}

(function(){
  let x0=null,y0=0,t0=0;
  const blocked=el=>el.closest("[data-swipe],[data-pswipe],.chips,.tabs,.quick,.subnav,input,select,textarea,.stepper,video,.sets,.eff,.cal,nav,.glasses,.supps,details[open] .hist,#qaCard,#mvCard");
  document.addEventListener("touchstart",e=>{if(e.touches.length!==1||blocked(e.target)||view()==="start"){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();},{passive:true});
  document.addEventListener("touchend",e=>{
    if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2||Date.now()-t0>700)return;
    if(view()==="jidlo"&&fAdd)return;
    const i=TABS.indexOf(tabOf(view())),j=i+(dx<0?1:-1);if(j<0||j>=TABS.length)return;
    const m=document.getElementById("view");m.className=dx<0?"slide-l":"slide-r";location.hash="#"+TABS[j];
    setTimeout(()=>m.className="",260);
  },{passive:true});
})();

/* ---------- navigace ---------- */
const view=()=>(location.hash||"#dnes").slice(1);
function render(){
  if(!PROFILE&&view()!=="start"){location.hash="#start";return;}
  const v=view();
  document.querySelector("nav").hidden=v==="start";
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",(a.dataset.v===tabOf(v))?"page":"false"));
  document.getElementById("chips").hidden=v!=="trenink";
  renderWeighNote();
  const sub=document.getElementById("subnav"),grp=["trenink","statistiky","program"].includes(v)?[["trenink","Dnešní trénink"],["statistiky","Statistiky"],["program","Program"]]:["jidlo","jidlo-plan","jidlo-vareni","jidlo-nakup"].includes(v)?[["jidlo","Deník"],["jidlo-plan","Plán"],["jidlo-vareni","Vaření"],["jidlo-nakup","Nákup"]]:null;
  sub.hidden=!grp||(v==="jidlo"&&fAdd);
  sub.innerHTML=(grp||[]).map(([k,t])=>`<a href="#${k}" aria-current="${k===v?"page":"false"}">${t}</a>`).join("");
  if(v==="start")renderStart();else if(v==="statistiky")renderStats();else if(v==="program")renderProgram();else if(v==="profil")renderProfile();
  else if(v==="trenink")renderToday();else if(v==="jidlo")renderFood();else if(v==="jidlo-plan")renderPlan();else if(v==="jidlo-nakup")renderShop();else if(v==="jidlo-vareni")renderCook();else if(v==="penize")renderMoney();else renderHome();
  renderStatus();animate();tickClock();
}
let weighOpen=false;
function renderWeighNote(){
  const el=document.getElementById("weighNote");
  if(!PROFILE||view()==="start"||!needWeigh()||Date.now()-LS.get("tr4_weigh_snooze",0)<3*864e5){el.hidden=true;return;}
  const w=weighins(),txt=w.length?`Váha naposledy před ${Math.round((Date.now()-w[w.length-1].ts)/864e5)} dny`:"Zatím žádná zapsaná váha";
  el.hidden=false;
  el.innerHTML=weighOpen?`<div class="bwrow"><input type="number" inputmode="decimal" step="0.1" id="bwIn" value="${bw()}" aria-label="Tělesná váha kg"><span class="hint">kg</span><button class="mini" id="bwSave">Uložit</button><button class="mini" id="bwLater" style="color:var(--muted)">Později</button></div>`
    :`<button class="mini" id="bwOpen" style="color:var(--muted);font-weight:500">${txt}. Zapsat ›</button>`;
  const o=document.getElementById("bwOpen");if(o)o.onclick=()=>{weighOpen=true;renderWeighNote();};
  const l=document.getElementById("bwLater");if(l)l.onclick=()=>{LS.set("tr4_weigh_snooze",Date.now());weighOpen=false;renderWeighNote();};
  const s=document.getElementById("bwSave");if(s)s.onclick=()=>saveWeight(document.getElementById("bwIn").value,()=>{weighOpen=false;render();});
}
async function saveWeight(v,done){
  const kg=parseFloat(String(v).replace(",","."));if(!(kg>30&&kg<250))return;
  const now=Date.now();await store({v:4,typ:"vaha",id:"v"+now,ts:now,date:todayISO(),kg});
  if(draft&&!draftHasData())replan(false);done&&done();
}
window.addEventListener("hashchange",()=>{if(view()!=="jidlo"){fAdd=false;fSel=null;}stopScan();render();scrollTo(0,0);});
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had){had=true;return;}
    const n=document.getElementById("updNote");n.hidden=false;n.innerHTML=`Je nová verze appky. <button class="mini" id="updBtn">Obnovit</button>`;document.getElementById("updBtn").onclick=()=>location.reload();});
}
const fromGoogle=oauthReturn();
render();sync(fromGoogle&&!!tok());setTimeout(aiProcessPending,2000);

</script>
