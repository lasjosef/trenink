<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141517">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Trénink Horní/Spodní</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one column phone app, sticky header with workout chips, exercise cards with animated stick-figure demo */
:root{
  --bg:#f3f3f1;--surface:#ffffff;--fg:#1d1f22;--muted:#686d73;--line:#d9dbdc;
  --plate-red:#c8322b;--plate-blue:#2459b8;--plate-yellow:#c99700;--plate-green:#2f8a4a;
  --accent:var(--plate-red);--ok:#2f8a4a;--warn:#b46a00;--fig:#1d1f22;--fig-eq:#8a8f95;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517;--surface:#1e2023;--fg:#ececea;--muted:#9a9fa5;--line:#33363a;
  --plate-red:#ef5a50;--plate-blue:#5b8ef0;--plate-yellow:#e6b72e;--plate-green:#4fbf72;
  --ok:#4fbf72;--warn:#e69a2e;--fig:#ececea;--fig-eq:#7d838a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141517;--surface:#1e2023;--fg:#ececea;--muted:#9a9fa5;--line:#33363a;
  --plate-red:#ef5a50;--plate-blue:#5b8ef0;--plate-yellow:#e6b72e;--plate-green:#4fbf72;
  --ok:#4fbf72;--warn:#e69a2e;--fig:#ececea;--fig-eq:#7d838a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.05}
h2{font-size:22px}
h3{font-size:19px;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);
  padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip .next{font-size:11px;color:var(--muted);font-weight:500}
.status{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.status.err{border-color:var(--warn)}
.status button{margin-left:6px}
main{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ex-top{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start}
.ex-top>div{min-width:0}
.demo{width:112px;height:90px;border-radius:8px;background:var(--bg);color:var(--fig)}
.target{font-family:var(--display);font-size:17px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.tip{font-size:13px}
.sugg{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.sugg.up{color:var(--ok)}.sugg.hold{color:var(--muted)}.sugg.down{color:var(--warn)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px 8px;align-items:center;font-variant-numeric:tabular-nums}
.sets .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sets .n{font-family:var(--display);font-size:17px;color:var(--muted);text-align:center}
input[type=number]{width:100%;min-width:0;font:600 17px var(--body);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
input[type=number]:focus{outline:none;border-color:var(--accent)}
.done{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font-size:20px;cursor:pointer}
.done[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mini{font:600 13px var(--body);background:none;border:none;color:var(--accent);cursor:pointer;padding:4px 0}
a{color:var(--accent)}
.btn{font:700 18px var(--display);letter-spacing:.03em;text-transform:uppercase;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 16px;width:100%;cursor:pointer}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);font-size:15px;padding:10px 14px;width:auto}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{display:flex;gap:4px;max-width:640px;width:100%}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:700 16px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:10px 4px;border-radius:8px}
nav a[aria-current="page"]{color:var(--fg);background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:700 28px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;color:var(--fg)}
select{font:600 15px var(--body);padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .it{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.prog-ex{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.prog-ex .demo{width:72px;height:58px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.saved{color:var(--ok);font-weight:600;text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.sets{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) auto}
.eff{display:flex;gap:3px}
.eff button{min-width:40px;padding:0 6px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font:700 13px var(--body);cursor:pointer}
.eff button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.eff button.lim[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sets .lastrow{grid-column:1/-1;font-size:12px;color:var(--accent);font-weight:600;margin-top:-2px}
.plan{font-size:13px;display:flex;flex-direction:column;gap:2px}
.plan b{font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.cal{color:var(--warn);border-color:var(--warn)}
.badge.st{color:var(--ok);border-color:var(--ok)}
.checkin{border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button,.sore button{font:600 13px var(--body);padding:9px 2px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sore{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sore button{text-align:left;padding:9px 10px;display:flex;justify-content:space-between;gap:6px}
.sore button[data-l="1"]{border-color:var(--warn);color:var(--warn)}
.sore button[data-l="2"]{background:var(--warn);border-color:var(--warn);color:#fff}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.an{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.an .d{text-align:right;font-weight:700}
.an .up{color:var(--ok)}.an .dn{color:var(--warn)}
.an .nx{grid-column:1/-1;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.bwrow{display:flex;gap:8px;align-items:center}
.bwrow input{max-width:110px}

.n.chk{width:22px;height:40px;border:none;background:none;color:var(--muted);font:700 17px var(--display);cursor:pointer;padding:0}
.n.chk[aria-pressed="true"]{color:var(--ok);font-size:20px}
details.tip summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.cover{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:4px}
.cover span{color:var(--muted)}.cover .on{color:var(--ok);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.cal .day{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-variant-numeric:tabular-nums}
.cal .day i{width:8px;height:8px;border-radius:50%;display:block}
.cal .day.today{outline:1.5px solid var(--accent)}
.cal .day.fut{opacity:.35}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.legend{font-size:12px;color:var(--muted);line-height:1.35}
.legend b{color:var(--fg)}
</style>

</head>
<body>
<div class="wrap">
<header>
  <div class="row between">
    <div><h1 id="hTitle">Trénink</h1><div class="sub" id="hSub">Horní / Spodní · 4× týdně</div></div>
    <div class="sub" id="syncInfo">Jen v telefonu</div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="clock" class="sub" hidden style="margin-top:6px;font-variant-numeric:tabular-nums"></div>
  <div id="weighNote" class="sub" hidden style="margin-top:6px"></div>
  <div id="status" hidden></div>
</header>
<main id="view"></main>
</div>
<nav><div class="in">
  <a href="#dnes" data-v="dnes">Trénink</a>

</div></nav>

const RIR={e:3,h:1.5,l:0.5};
const e1=(load,reps,rir)=>load*(1+(reps+rir)/30);
const loadOf=(ex,kg,b)=>ex.t==="telo"?b+(+kg||0):(+kg||0);

const MINKG={bar:20,plates:0,stack:2.5,db:2,telo:0};
function roundKg(ex,kg){const st=STEP[ex.t];return Math.max(MINKG[ex.t],Math.round(kg/st+0.1)*st);}
function plateText(ex,kg){
  if(ex.t!=="bar"&&ex.t!=="plates")return "";
  let side=ex.t==="bar"?(kg-20)/2:kg/2;if(side<=0)return ex.t==="bar"?"jen tyč":"";
  const out=[];for(const p of PLATES){while(side>=p-1e-9){out.push(p);side-=p;}}
  return "na stranu "+out.map(fmt).join(" + ");
}
function hoursSince(group,beforeTs){
  const ws=workouts();for(let i=ws.length-1;i>=0;i--){const w=ws[i];if(w.ts>=beforeTs)continue;
    if(w.cviky.some(c=>EX[c.n]&&EX[c.n].g.includes(group)))return (beforeTs-w.ts)/36e5;}
  return Infinity;
}
function readiness(ex,stav,ts){
  const en=ENERGY_F[stav&&stav.energie!=null?stav.energie:2];
  const so=Math.min(1,...ex.g.map(g=>SORE_F[(stav&&stav.bolest&&stav.bolest[g])||0]));
  const rec=ex.g.some(g=>hoursSince(g,ts)<44)?0.96:1;

}
function sessionEst(c,ex,b){
  let best=0;c.sets.forEach((s,j)=>{if(!s[1])return;const v=e1(loadOf(ex,s[0],b),s[1],s[2]?RIR[s[2]]:2)*(1+0.01*Math.min(j,3));if(v>best)best=v;});
  return best/(c.r||1);

function model(name,beforeTs=Infinity){
  const ex=EX[name];if(!ex)return null;const ests=[];
  for(const w of workouts()){if(w.ts>=beforeTs)continue;const c=w.cviky.find(x=>x.n===name);if(!c)continue;const v=sessionEst(c,ex,(w.stav&&w.stav.vaha)||w.bw||DEFAULT_BW);if(v>0)ests.push({ts:w.ts,v});}
  if(!ests.length)return null;
  const n=ests.length,last=ests[n-1].v,prev=ests.slice(Math.max(0,n-4),n-1).map(x=>x.v);
  const est=prev.length?Math.max(0.7*last+0.3*prev.reduce((a,b)=>a+b,0)/prev.length,last*0.97):last;
  return {est,n,ests};
}
function targetFor(ex,R,m,b){
  const pf=pushFor(ex.n);
  if(!m)return {kg:roundKg(ex,ex.kg*R),reps:ex.r2,cal:true,first:true,pf};
  const goal=m.est*R*(1+pf.p);
  let load=goal/(1+(ex.r2+2)/30);
  if(ex.t==="telo"){
    const extra=load-b;
    if(extra<STEP.telo){const reps=Math.max(1,Math.min(40,Math.floor(30*(goal/b-1)-2)));return {kg:0,reps,cal:m.n<3,pf};}
    return {kg:roundKg(ex,extra),reps:ex.r2,cal:m.n<3,pf};

}
// Tempo růstu se učí z toho, jestli plníš cíle. Nesplněný cíl ve špatný den se nepočítá.
function pushFor(name){
  let p=PUSH-1,miss=0,deload=false,last="";const ex=EX[name];
  for(const w of workouts()){
    const c=w.cviky.find(x=>x.n===name);if(!c||!c.t)continue;deload=false;
    const atKg=c.sets.filter(s=>(+s[0])>=c.t.kg-0.01);
    const hit=atKg.filter(s=>s[1]>=c.t.reps).length/(c.t.s||ex.s);
    const easy=atKg.some(s=>s[2]==="e");
    if(hit>=1){miss=0;p=Math.min(easy?0.035:0.025,p+(easy?0.01:0.005));last=easy?"easy":"hit";}
    else if(hit>=0.5){miss=0;p=Math.max(0.01,p-0.005);last="part";}
    else if((c.r||1)<0.95){last="badday";}
    else{miss++;p=Math.max(0,p-0.0125);last="miss";if(miss>=2){deload=true;miss=0;p=0.0125;last="deload";}}
  }
  return {p:deload?-0.05:p,last,deload};
}
const pct=p=>(p>=0?"+":"−")+Math.abs(p*100).toFixed(1).replace(".0","").replace(".",",")+" %";
function liveKg(ex,sets,k,b){

  if(!best)return null;

}

async function g(url,opt={}){
  const t=tok();if(!t)throw {auth:true};
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}});
  if(r.status===401){LS.set("tr3_token",null);throw {auth:true};}

}

  if(j.files&&j.files.length)id=j.files[0].id;
  else id=(await (await g(`${API}/files?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"Trénink",mimeType:"application/vnd.google-apps.folder"})})).json()).id;

    const j=await (await g(`${API}/files?q=${q}&fields=nextPageToken,files(id,name,appProperties)&pageSize=200${pt?"&pageToken="+pt:""}`)).json();

async function upload(fid,r){

async function sync(interactive){
  if(!CLIENT_ID){syncState="nocfg";renderStatus();return;}
  if(!navigator.onLine){syncState="offline";renderStatus();return;}
  if(syncState==="busy")return;
  if(!tok()){
    if(!interactive){syncState="needlogin";renderStatus();return;}
    try{await login();}catch(e){syncState="err";syncErr=e.message;renderStatus();return;}
  }
  syncState="busy";renderStatus();
  try{
    const fid=await folderId();
    let remote;
    try{remote=await listRemote(fid);}catch(e){if(!e.auth){LS.set("tr3_folder",null);}throw e;}
    const have=new Set(remote.map(f=>f.appProperties&&f.appProperties.rid).filter(Boolean));
    for(const id of [...unsynced]){
      if(!DB[id]){unsynced.delete(id);continue;}
      if(!have.has(id))await upload(fid,DB[id]);   // co už na Disku je, znovu neposílám
      unsynced.delete(id);saveDB();
    }
    let pulled=0;
    for(const f of remote){const rid=f.appProperties&&f.appProperties.rid;if(!rid||DB[rid])continue;
      try{const rec=await (await g(`${API}/files/${f.id}?alt=media`)).json();if(rec&&rec.id){DB[rec.id]=rec;pulled++;}}catch(e){}}
    saveDB();LS.set("tr3_lastsync",Date.now());syncState="ok";
    if(pulled)render();
  }catch(e){
    if(e&&e.auth){syncState="needlogin";}else{syncState="err";syncErr=e.message||"Synchronizace selhala";}
  }
  renderStatus();
}
async function store(r){DB[r.id]=r;unsynced.add(r.id);saveDB();await sync(false);return !unsynced.has(r.id);}
function renderStatus(){

  let html="";
  if(syncState==="needlogin")html=`${n?`${n} ${n===1?"záznam čeká":"záznamy čekají"} na odeslání. `:""}Pro zálohu na Google Disk se přihlas. <button class="mini" id="syncBtn">Přihlásit a odeslat</button>`;
  else if(syncState==="err")html=`${syncErr}. <button class="mini" id="syncBtn">Zkusit znovu</button>`;
  else if(n&&(syncState==="offline"||syncState==="nocfg"))html="";
  else if(n&&syncState!=="busy")html=`${n} ${n===1?"záznam čeká":"záznamy čekají"} na odeslání. <button class="mini" id="syncBtn">Odeslat</button>`;
  el.hidden=!html;el.className="status"+(syncState==="err"?" err":"");el.innerHTML=html;

const draftHasData=()=>draft&&draft.sets.some(a=>a.some(s=>s[4]||s[1]!==""));
const OTHER={H1:"H2",H2:"H1",S1:"S2",S2:"S1"};
function doneSince(ts){const set=new Set();for(const w of workouts())if(w.ts>=ts)for(const c of w.cviky)if(c.sets.length)set.add(c.n);return set;}
// Vynechané cviky se nepřidávají navíc k celému tréninku: nahradí cvik na partii, která už je tento týden hotová.
function carryFor(tid){
  const o=OTHER[tid],wk=Date.now()-7*864e5,none={add:[],drop:[]};
  const lastO=workouts().filter(w=>w.trenink===o&&w.ts>=wk).pop();if(!lastO)return none;
  const done=doneSince(wk),today=PROGRAM[tid].c.map(e=>e.n);
  const hit=new Set();for(const n of done)hit.add(EX[n].m[0]);                     // partie hotové tento týden (hlavní)
  const todayPrim=new Set(today.map(n=>EX[n].m[0]));                                 // hlavní partie dnešních cviků
  const add=PROGRAM[o].c.map(e=>e.n).filter(n=>!done.has(n)&&!hit.has(EX[n].m[0])&&!todayPrim.has(EX[n].m[0])).slice(0,2);
  if(!add.length)return none;
  const cnt={};today.forEach(n=>{const p=EX[n].m[0];cnt[p]=(cnt[p]||0)+1;});
  const score=n=>{const p=EX[n].m[0];return (hit.has(p)?2:0)+(cnt[p]>1?1:0);};           // čím víc už je partie pokrytá, tím dřív ji vyměním
  const cand=today.map((n,i)=>[n,i]).filter(([n])=>score(n)>0).sort((x,y)=>score(y[0])-score(x[0])||y[1]-x[1]);
  const drop=cand.slice(0,add.length).map(x=>x[0]);
  return {add:drop.length?add.slice(0,drop.length):add.slice(0,1),drop};
}
const ISO=new Set(["lateral","curl","pushdown","fly","facepull","calf","crunch","legraise"]);
function orderWithCarry(tid,carry,drop){ // vícekloubový dohnaný cvik jde úplně první, izolovaný hned po prvním hlavním cviku (ať neunaví tlaky)
  const list=PROGRAM[tid].c.map(e=>e.n).filter(n=>!drop.includes(n));
  for(const n of carry.slice().reverse()){if(ISO.has(EX[n].pat))list.splice(1,0,n);else list.unshift(n);}
  return list;
}
function newDraft(tid,back){
  const cf=back?{add:[],drop:[]}:carryFor(tid),carry=cf.add;
  draft={v3:true,tid,back:back||null,started:null,lastSetAt:null,stav:{energie:2,bolest:{},ok:false},carry,dropped:cf.drop,exs:orderWithCarry(tid,carry,cf.drop),sets:[],targets:[]};
  replan(true);return draft;
}
const dEx=i=>EX[draft.exs[i]];
function replan(all){
  const d=draft,b=bw();
  d.targets=d.exs.map(n=>targetFor(EX[n],d.stav.lehci?0.95:1,model(n),b));
  d.exs.forEach((n,i)=>{
    const ex=EX[n];
    if(!d.sets[i])d.sets[i]=Array.from({length:ex.s},()=>[d.targets[i].kg,"","",false,false]);
    d.sets[i].forEach(s=>{if(!s[3]&&!s[4]&&(s[1]===""||all))s[0]=d.targets[i].kg;});
    relive(i);
  });
  saveDraft();
}
function relive(i){
  const d=draft,ex=dEx(i),b=bw(),a=d.sets[i];
  for(let k=1;k<a.length;k++){if(a[k][3]||a[k][4]||a[k][1]!=="")continue;const v=liveKg(ex,a.map(s=>s[4]?s:[s[0],"",""]),k,b);if(v!=null)a[k][0]=v;}
}
const saveDraft=()=>LS.set("tr3_draft",draft);
function ensureDraft(){
  const tid=sel||nextId();
  if(draft&&draft.v3&&(draft.tid===tid||draftHasData()||draft.back))return draft;
  return newDraft(tid);
}
draft=LS.get("tr3_draft",null);

/* ---------- diagnóza ---------- */
function diagnose(name){
  const ex=EX[name],hist=[];
  for(const w of workouts()){const c=w.cviky.find(x=>x.n===name);if(c)hist.push({w,c,est:sessionEst(c,ex,w.bw||DEFAULT_BW)});}
  const h=hist.slice(-4);if(h.length<2)return null;
  const below=h.filter(x=>x.c.t&&Math.max(...x.c.sets.map(s=>+s[0]))<x.c.t.kg-0.01);
  const lowR=h.filter(x=>(x.c.r||1)<0.95).length>=Math.ceil(h.length/2);
  const gaps=h.slice(1).map((x,i)=>(x.w.ts-h[i].w.ts)/864e5),gap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const falling=h.length>=3&&h[h.length-1].est<h[0].est*0.98;
  if(below.length>=2){
    const tk=fmt(below[below.length-1].c.t.kg);
    if(falling&&lowR)return `Posledně ${below.length}× pod cílem (${tk} kg) a často unavený. Vypadá to na přetížení: dej lehčí týden, víc spánku a jídla.`;
    if(falling)return `Posledně ${below.length}× pod cílem (${tk} kg) a síla klesá. Cíl je zatím vysoko, appka ho stáhla na tvou reálnou úroveň a staví znovu.`;
    return `Posledně ${below.length}× pod cílem (${tk} kg), ale síla se drží. Příště vezmi plnou cílovou váhu, máš na ni.`;
  }
  if(falling){
    if(lowR)return "Síla klesá a v těch dnech jsi byl unavený. Spíš přetížení než slabost.";
    if(gap>6)return `Síla klesá, mezi tréninky máš v průměru ${Math.round(gap)} dní. Pravidelnost pomůže víc než váha.`;
    return "Síla klesá bez jasné příčiny. Hlídej spánek a jídlo, appka zpomalila tempo.";
  }
  return null;
}
function warmup(ex,i){
  if(!["bar","plates"].includes(ex.t))return "";
  const t=draft.targets[i].kg,base=ex.t==="bar"?20:0;
  const w=p=>roundKg(ex,Math.max(base,t*p));
  if(i===0)return `Rozcvička (nepočítá se): ${fmt(w(0.5))} kg × 8, pak ${fmt(w(0.75))} kg × 3`;
  if(HEAVY.has(ex.pat)||BIG.has(ex.pat))return `Rozcvička (nepočítá se): ${fmt(w(0.6))} kg × 5`;
  return "";
}

/* ---------- týdenní pokrytí ---------- */
function weekGroups(){const s=weekStart(Date.now()),g=new Set();for(const w of workouts())if(w.ts>=s)for(const c of w.cviky)if(c.sets.length&&EX[c.n])EX[c.n].m.forEach(x=>g.add(x));return g;}

/* ---------- vykreslení ---------- */
const view=()=>(location.hash||"#dnes").slice(1);
function render(){
  const v=view();
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  document.getElementById("chips").hidden=v!=="dnes";
  renderWeighNote();
  if(v==="statistiky")renderStats();else if(v==="program")renderProgram();else renderToday();
  animate();
}
let weighOpen=false;
function renderWeighNote(){
  const el=document.getElementById("weighNote");
  const snooze=LS.get("tr2_weigh_snooze",0);
  if(!needWeigh()||Date.now()-snooze<3*864e5){el.hidden=true;return;}
  const w=weighins(),txt=w.length?`Váha naposledy před ${Math.round((Date.now()-w[w.length-1].ts)/864e5)} dny`:"Zatím žádná zapsaná váha";
  el.hidden=false;
  el.innerHTML=weighOpen?`<div class="bwrow"><input type="number" inputmode="decimal" step="0.1" id="bwIn" value="${fmt(bw()).replace(",",".")}" aria-label="Tělesná váha kg"><span class="hint">kg</span><button class="mini" id="bwSave">Uložit</button><button class="mini" id="bwLater" style="color:var(--muted)">Později</button></div>`
    :`<button class="mini" id="bwOpen" style="color:var(--muted);font-weight:500">${txt}. Zapsat ›</button>`;
  const o=document.getElementById("bwOpen");if(o)o.onclick=()=>{weighOpen=true;renderWeighNote();};
  const l=document.getElementById("bwLater");if(l)l.onclick=()=>{LS.set("tr2_weigh_snooze",Date.now());weighOpen=false;renderWeighNote();};
  const s=document.getElementById("bwSave");if(s)s.onclick=()=>saveWeight(document.getElementById("bwIn").value,()=>{weighOpen=false;render();});
}
async function saveWeight(v,done){
  const kg=parseFloat(String(v).replace(",","."));if(!(kg>30&&kg<250))return;
  const now=new Date();await store({v:2,typ:"vaha",id:"v"+now.getTime(),ts:now.getTime(),date:now.toISOString().slice(0,10),kg});
  if(draft){replan(false);}done&&done();
}
function renderChips(d){
  const nx=nextId();
  document.getElementById("chips").innerHTML=ORDER.map(id=>`<button class="chip" style="--c:${COLORS[id]}" data-t="${id}" aria-pressed="${d.tid===id}"><span class="dot"></span>${PROGRAM[id].n}${id===nx&&!d.back?' <span class="next">na řadě</span>':""}</button>`).join("");
  document.querySelectorAll(".chip[data-t]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;if(t===draft.tid)return;
    if(draftHasData()&&b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Zahodit zapsané? Klepni znovu";return;}
    sel=t;newDraft(t,draft.back);render();
  });
}
function statusBadge(m){if(!m)return `<span class="badge cal">Kalibrace 1/3</span>`;if(m.n<3)return `<span class="badge cal">Kalibrace ${m.n+1}/3</span>`;return `<span class="badge st">Stabilní data</span>`;}
function checkinHTML(d){
  const st=d.stav;
  if(d.back)return `<section class="card checkin"><div class="row between"><div><span class="lbl">Zápis staršího tréninku</span><div><b>${new Date(d.back+"T12:00").toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"numeric"})}</b> · odškrtni, co jsi dal</div></div><button class="mini" id="backCancel">Zrušit</button></div></section>`;
  if(st.ok){
    const sore=Object.entries(st.bolest).filter(([,l])=>l).map(([g,l])=>GROUPS[g]+(l===2?" (hodně)":" (trochu)"));
    return `<section class="card"><div class="row between"><div><span class="lbl">Dnešní stav · jen do rozboru</span><div>${ENERGY[st.energie]}${sore.length?" · bolí: "+sore.join(", "):""}${st.lehci?" · <b>lehčí den −5 %</b>":""}</div></div><button class="mini" id="ciEdit">Upravit</button></div></section>`;
  }
  return `<section class="card checkin"><h3>Jak se dnes cítíš?</h3><div class="hint">Trénink to nemění, jde to jen do rozboru.</div>

    <span class="lbl">Co tě bolí? (1× trochu, 2× hodně)</span>
    <div class="sore">${Object.entries(GROUPS).map(([g,t])=>{const l=st.bolest[g]||0;return `<button data-g="${g}" data-l="${l}"><span>${t}</span><span>${["","trochu","hodně"][l]}</span></button>`}).join("")}</div>
    <button class="chip" id="ciLight" style="--c:var(--warn)" aria-pressed="${!!st.lehci}"><span class="dot"></span>Lehčí den −5 % (jen když fakt nemůžeš)</button>
    <button class="btn" id="ciGo">Jdu na to</button></section>`;
}
const effTxt={e:"3+",h:"1–2",l:"hr."};
function exHTML(d,ex,i){
  const t=d.targets[i],m=model(ex.n),b=bw();
  const lastW=workouts().slice().reverse().find(w=>w.cviky.some(c=>c.n===ex.n));
  const lastC=lastW&&lastW.cviky.find(c=>c.n===ex.n);
  const lastTxt=lastC?`Minule: ${lastC.sets.map(s=>(ex.t==="telo"&&!s[0]?"":fmt(s[0])+"×")+s[1]+(s[2]?" ("+effTxt[s[2]]+")":"")).join(", ")}`:"";
  const kgTxt=ex.t==="telo"?(t.kg?`+${fmt(t.kg)} kg`:"vlastní váha"):`${fmt(t.kg)} kg`;
  const plates=plateText(ex,t.kg);
  const pf=t.pf||pushFor(ex.n);
  const tempo=m?(pf.deload?"Odlehčení −5 % na jeden trénink":"Tempo "+pct(pf.p)+" za trénink"):"";
  const diag=diagnose(ex.n),wu=warmup(ex,i),carry=d.carry.includes(ex.n);
  const rows=d.sets[i].map((s,j)=>`<button class="n chk" data-chk="${i}-${j}" aria-pressed="${!!s[4]}" aria-label="Série ${j+1} hotová">${s[4]?"✓":j+1}</button>
    <input type="number" inputmode="decimal" step="0.5" id="kg-${i}-${j}" value="${s[0]===""?"":s[0]}" aria-label="Série ${j+1} kg">
    <input type="number" inputmode="numeric" id="r-${i}-${j}" value="${s[1]}" placeholder="${t.reps}" aria-label="Série ${j+1} opakování">
    <div class="eff" role="group" aria-label="Jak těžké to bylo">
      <button data-e="e" data-ij="${i}-${j}" aria-pressed="${s[2]==="e"}" title="Lehké, 3 a víc v záloze">3+</button>
      <button data-e="h" data-ij="${i}-${j}" aria-pressed="${s[2]==="h"}" title="Těžké, 1–2 v záloze">1–2</button>
      <button data-e="l" data-ij="${i}-${j}" class="lim" aria-pressed="${s[2]==="l"}" title="Hranice, víc si sám nevěřím">Hranice</button>
    </div>
    ${j===d.sets[i].length-1?`<div class="lastrow">↑ tuhle sérii k hranici</div>`:""}`).join("");
  const locked=!d.back&&!d.stav.ok;
  return `<section class="card${locked?" locked":""}" id="ex-${i}" ${locked?'aria-disabled="true"':""}>
    <div class="ex-top">${demo(ex.pat)}<div>
      <div class="row">${carry?`<span class="badge cal">Dohnat z minula</span>`:""}${statusBadge(m)}</div>
      <h3 style="margin-top:4px">${ex.n}</h3>
      <div class="target">${ex.s} × ${t.reps} · ${kgTxt}</div>
      ${plates?`<div class="hint">${plates}</div>`:""}
      <div class="hint">Pauza ${restTxt(restSec(ex))}${tempo?" · "+tempo:""}</div>
    </div></div>
    ${wu||lastTxt||diag?`<div class="plan">${wu?`<div>${wu}</div>`:""}${lastTxt?`<div class="hint">${lastTxt}</div>`:""}${diag?`<div style="color:var(--warn)">${diag}</div>`:""}</div>`:""}
    <details class="tip"><summary>Technika</summary>${ex.tip} <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.n.replace(/\s*\(.*\)/,"")+" technika")}" target="_blank" rel="noopener">Video</a></details>
    <div class="legend">Kolik opakování bys ještě dal? <b>3+</b> lehké, ještě 3 a víc · <b>1–2</b> těžké, ještě 1–2 · <b>Hranice</b> víc si sám netroufnu</div>
    <div class="sets"><div class="h">✓</div><div class="h">${ex.t==="telo"?"+ kg":"kg"}</div><div class="h">Opak.</div><div class="h">Jak to šlo</div>${rows}</div>
    <button class="mini" data-add="${i}">+ přidat sérii</button>
  </section>`;
}
function coverageHTML(){
  const g=weekGroups();
  return `<div class="cover">${Object.entries(MUSCLES).map(([k,t])=>`<span class="${g.has(k)?"on":""}">${g.has(k)?"✓":"○"} ${t}</span>`).join("")}</div>`;
}
function renderToday(){
  const d=ensureDraft(),P=PROGRAM[d.tid];
  document.documentElement.style.setProperty("--accent",COLORS[d.tid]);
  document.getElementById("hTitle").textContent=P.n;
  const ws=workouts();
  document.getElementById("hSub").textContent=d.back?"Zápis staršího tréninku":`Tento týden ${weekCount(ws,0)}/4 · cca ${workoutMin(d.tid)} min`;
  renderChips(d);
  const doneN=d.sets.flat().filter(s=>s[4]).length;
  document.getElementById("view").innerHTML=(d.back?"":`<div class="card" style="padding:10px 12px"><span class="lbl">Tento týden</span>${coverageHTML()}</div>`)+checkinHTML(d)+
    (d.carry.length?`<div class="hint">Minule jsi vynechal <b>${d.carry.join(" a ")}</b>. Je zařazený dopředu místo <b>${d.dropped.join(" a ")}</b>, protože tu partii už máš tento týden hotovou. Trénink je tak stejně dlouhý.</div>`:"")+
    (!d.back&&!d.stav.ok?`<div class="hint" style="text-align:center">Cviky se odemknou po klepnutí na Jdu na to. Tím se spustí i čas.</div>`:"")+
    d.exs.map((n,i)=>exHTML(d,EX[n],i)).join("")+
    `<div id="finish" class="card" style="background:none;border:none;padding:0"><div class="hint" style="text-align:center">Uloží se jen odškrtnuté série (${doneN}). Nedodělané cviky appka hlídá na příště.</div><button class="btn" id="saveBtn">Uložit trénink</button></div>`;
  bindToday();tickClock();
}
function setDone(i,j,on){
  const d=draft,s=d.sets[i][j];s[4]=on;
  if(on){if(s[1]==="")s[1]=d.targets[i].reps;if(!d.back)d.lastSetAt=Date.now();}
  else s[2]="";
  relive(i);saveDraft();
}
function bindToday(){
  const d=draft;
  document.querySelectorAll("[data-en]").forEach(b=>b.onclick=()=>{d.stav.energie=+b.dataset.en;saveDraft();renderToday();});
  document.querySelectorAll(".sore button").forEach(b=>b.onclick=()=>{const g=b.dataset.g;d.stav.bolest[g]=((d.stav.bolest[g]||0)+1)%3;saveDraft();renderToday();});
  const lt=document.getElementById("ciLight");if(lt)lt.onclick=()=>{d.stav.lehci=!d.stav.lehci;replan(false);renderToday();};
  const go=document.getElementById("ciGo");if(go)go.onclick=()=>{d.stav.ok=true;if(!d.started)d.started=Date.now();replan(false);renderToday();scrollTo({top:0});};
  const ed=document.getElementById("ciEdit");if(ed)ed.onclick=()=>{d.stav.ok=false;renderToday();};
  const bc=document.getElementById("backCancel");if(bc)bc.onclick=()=>{draft=null;saveDraft();sel=null;render();};
  document.querySelectorAll(".sets input").forEach(inp=>inp.addEventListener("change",()=>{
    const [t,i,j]=inp.id.split("-");let v=inp.value===""?"":parseFloat(inp.value.replace(",","."));if(isNaN(v))v="";
    const s=d.sets[i][j];
    if(t==="kg"){s[0]=v;s[3]=true;for(let k=+j+1;k<d.sets[i].length;k++){const n=d.sets[i][k];if(!n[4]&&n[1]===""){n[0]=v;n[3]=true;}}}
    else{s[1]=v;relive(+i);}
    saveDraft();syncInputs(+i);
  }));
  document.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.chk.split("-").map(Number);setDone(i,j,!d.sets[i][j][4]);renderSets(i);});
  document.querySelectorAll(".eff button").forEach(b=>b.onclick=()=>{
    const [i,j]=b.dataset.ij.split("-").map(Number),s=d.sets[i][j];
    const e=s[2]===b.dataset.e?"":b.dataset.e;
    if(e){s[2]=e;setDone(i,j,true);}else{s[2]="";saveDraft();}
    renderSets(i);
  });
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const i=+b.dataset.add,a=d.sets[i];a.push([a.length?a[a.length-1][0]:d.targets[i].kg,"","",false,false]);relive(i);saveDraft();renderToday();});
  document.getElementById("saveBtn").onclick=finish;
}
function renderSets(i){ // překreslí jen jeden cvik, ať neskáče stránka
  const el=document.getElementById("ex-"+i);if(!el)return;
  const tmp=document.createElement("div");tmp.innerHTML=exHTML(draft,dEx(i),i);el.replaceWith(tmp.firstElementChild);
  const f=document.querySelector("#finish .hint");if(f)f.textContent=`Uloží se jen odškrtnuté série (${draft.sets.flat().filter(s=>s[4]).length}). Nedodělané cviky appka hlídá na příště.`;
  bindToday();animate();
}
function syncInputs(i){draft.sets[i].forEach((s,j)=>{const k=document.getElementById(`kg-${i}-${j}`),r=document.getElementById(`r-${i}-${j}`);if(k&&document.activeElement!==k)k.value=s[0]===""?"":s[0];if(r&&document.activeElement!==r)r.value=s[1];});}
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function tickClock(){
  const el=document.getElementById("clock");if(!el)return;
  const d=draft;
  if(view()!=="dnes"||!d||!d.started||d.back){el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML=`⏱ <b>${mmss(Date.now()-d.started)}</b>${d.lastSetAt?` · od série <b>${mmss(Date.now()-d.lastSetAt)}</b>`:""}`;
}
setInterval(tickClock,1000);
async function finish(){
  const d=draft,P=PROGRAM[d.tid],b=bw();
  const ts=d.back?new Date(d.back+"T18:00").getTime():Date.now();
  const cviky=d.exs.map((n,i)=>{const ex=EX[n],t=d.targets[i];return {n,r:+readiness(ex,d.stav,ts).toFixed(3),t:t&&!t.first&&!d.back?{kg:t.kg,reps:t.reps,s:ex.s}:null,sets:d.sets[i].filter(s=>s[4]&&s[1]!==""&&s[1]>0).map(s=>[s[0]===""?0:+s[0],+s[1],s[2]||""])};}).filter(c=>c.sets.length);
  const box=document.getElementById("finish");
  if(!cviky.length){box.querySelector(".hint").textContent="Nejdřív odškrtni aspoň jednu sérii.";return;}
  const skipped=d.exs.filter(n=>!cviky.some(c=>c.n===n));
  const w={v:2,typ:"trenink",id:"w"+Date.now(),ts,date:new Date(ts).toISOString().slice(0,10),trenink:d.tid,nazev:P.n,trvani_min:d.started&&!d.back?Math.round((Date.now()-d.started)/60000):null,bw:b,zpetne:!!d.back,stav:{energie:d.stav.energie,bolest:d.stav.bolest,lehci:!!d.stav.lehci},vynechano:skipped,cviky};
  const before=Object.fromEntries(cviky.map(c=>[c.n,model(c.n,ts)]));
  box.innerHTML=`<button class="btn" disabled>Ukládám…</button>`;
  const ok=await store(w);
  draft=null;saveDraft();sel=null;
  box.outerHTML=analysisHTML(w,before,ok);
  document.getElementById("nextBtn").onclick=()=>{render();scrollTo(0,0);};
  tickClock();
}
function analysisHTML(w,before,ok){
  const rows=w.cviky.map(c=>{
    const ex=EX[c.n],a=before[c.n],m=model(c.n),t=targetFor(ex,1,m,w.bw);
    const kgTxt=ex.t==="telo"?(t.kg?"+"+fmt(t.kg)+" kg":t.reps+" opak."):fmt(t.kg)+" kg";
    let d="",cls="",msg;
    if(!a){d="nové";msg=`Kalibrace 1/3 hotová. Příště ${ex.s} × ${t.reps} na ${kgTxt}.`;}
    else{const p=(m.est/a.est-1)*100;d=(p>=0?"+":"")+p.toFixed(1).replace(".",",")+" %";cls=p>=0.5?"up":p<=-0.5?"dn":"";
      msg=p>=0.5?`Silnější. Příště ${kgTxt}.`:p<=-0.5?`Slabší i po započtení stavu. Příště ${kgTxt}.`:`Drží se. Příště ${kgTxt}, tlač opakování.`;
      const pf=pushFor(c.n);
      msg+={easy:` Šlo to lehce, zrychluju na ${pct(pf.p)}.`,miss:` Cíl nesplněn, zpomaluju na ${pct(pf.p)}.`,deload:" Podruhé nesplněno, příště odlehčení −5 % a pak zase nahoru.",badday:" Cíl nesplněn, ale byl jsi unavený, tempo nesnižuju.",part:` Cíl napůl, zpomaluju na ${pct(pf.p)}.`}[pf.last]||"";}
    const dg=diagnose(c.n);if(dg)msg+=" "+dg;
    return `<div>${c.n}</div><div class="d ${cls}">${d}</div><div class="nx">${msg}</div>`;
  }).join("");
  const sk=w.vynechano.length?`<div class="hint">Vynecháno: ${w.vynechano.join(", ")}. Co z toho do konce týdne nestihneš, dám příště na začátek.</div>`:"";
  return `<section class="card"><h2>Rozbor tréninku</h2>
    <div class="hint">${ok?"Uloženo v telefonu i na Google Disku.":"Uloženo v telefonu. Na Disk se pošle, až budeš online."}${w.trvani_min?` Trvalo ${w.trvani_min} min.`:""}</div>
    <div class="an">${rows}</div>${sk}
    <button class="btn" id="nextBtn">Další: ${PROGRAM[nextId()].n}</button></section>`;
}
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function weekCount(ws,back){const s=weekStart(Date.now())-back*7*864e5,e=s+7*864e5;return ws.filter(w=>w.ts>=s&&w.ts<e).length;}
function calendarHTML(ws){
  const start=weekStart(Date.now())-5*7*864e5,days=[];
  const byDay={};for(const w of ws){const k=new Date(w.ts).toDateString();(byDay[k]=byDay[k]||[]).push(w);}
  for(let i=0;i<42;i++){const t=start+i*864e5,dt=new Date(t),list=byDay[dt.toDateString()]||[];
    days.push(`<div class="day${dt.toDateString()===new Date().toDateString()?" today":""}${t>Date.now()?" fut":""}" title="${dt.toLocaleDateString("cs-CZ")}${list.length?": "+list.map(w=>w.nazev).join(", "):""}"><span>${dt.getDate()}</span>${list.map(w=>`<i style="background:${COLORS[w.trenink]}"></i>`).join("")}</div>`);}
  return `<div class="cal">${["Po","Út","St","Čt","Pá","So","Ne"].map(x=>`<div class="dh">${x}</div>`).join("")}${days.join("")}</div>`;
}
let statEx=null,backOpen=false;
function renderStats(){
  document.getElementById("hTitle").textContent="Statistiky";
  const ws=workouts();document.getElementById("hSub").textContent=`${ws.length} tréninků celkem · váha ${fmt(bw())} kg`;
  const weeks=Array.from({length:8},(_,i)=>weekCount(ws,7-i));
  let streak=0;for(let i=1;i<60&&weekCount(ws,i)>=3;i++)streak++;if(weekCount(ws,0)>=3)streak++;
  const names=ORDER.flatMap(id=>PROGRAM[id].c.map(e=>e.n));
  const models=names.map(n=>[n,model(n)]).filter(x=>x[1]);
  if(!statEx||!models.some(x=>x[0]===statEx))statEx=models.length?models[0][0]:null;
  const sm=statEx&&model(statEx),pts=sm?sm.ests.map(e=>({t:e.ts,v:e.v})):[];
  const wi=weighins().map(x=>({t:x.ts,v:x.kg}));
  const today=new Date().toISOString().slice(0,10);
  document.getElementById("view").innerHTML=`
  <div class="kpis"><div class="kpi"><b>${weekCount(ws,0)}/4</b><span>tento týden</span></div><div class="kpi"><b>${streak}</b><span>týdnů v kuse (3+)</span></div><div class="kpi"><b>${ws.length}</b><span>celkem</span></div></div>
  <section class="card"><div class="row between"><h2>Dny tréninku</h2><button class="mini" id="backBtn">${backOpen?"Zavřít":"+ Zapsat starší trénink"}</button></div>
    ${backOpen?`<div class="bwrow" style="flex-wrap:wrap"><input type="date" id="backDate" max="${today}" value="${today}" aria-label="Datum tréninku" style="font:600 15px var(--body);padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)">
      <select id="backT" aria-label="Který trénink">${ORDER.map(id=>`<option value="${id}">${PROGRAM[id].n}</option>`).join("")}</select>
      <button class="mini" id="backGo">Otevřít zápis</button></div>`:""}
    ${calendarHTML(ws)}<div class="hint">Tento týden: ${coverageHTML()}</div></section>
  <section class="card"><h2>Tréninky po týdnech</h2>${barChart(weeks)}</section>
  <section class="card"><div class="row between"><h2>Síla</h2>${models.length?`<select id="exSel" aria-label="Cvik">${models.map(([n])=>`<option ${n===statEx?"selected":""}>${n}</option>`).join("")}</select>`:""}</div>
    <div class="hint">Odhad maxima na 1 opakování, očištěný o tvůj stav v daný den.</div>
    ${pts.length>1?lineChart(pts):`<div class="empty">${pts.length?"Graf se ukáže po druhém tréninku s tímto cvikem.":"Po prvním uloženém tréninku tu uvidíš svou sílu."}</div>`}
    ${statEx&&diagnose(statEx)?`<div class="tip" style="color:var(--warn)">${diagnose(statEx)}</div>`:""}</section>
  <section class="card"><h2>Co appka ví</h2><div class="an">${models.length?models.map(([n,m])=>{const ex=EX[n],t=targetFor(ex,1,m,bw()),dg=diagnose(n);return `<div>${n}</div><div class="d">${ex.t==="telo"?"+"+fmt(Math.max(0,Math.round(m.est-bw()))):fmt(Math.round(m.est))} kg</div><div class="nx">${m.n<3?`Kalibrace ${m.n}/3`:"Stabilní"} · příště ${ex.t==="telo"?(t.kg?"+"+fmt(t.kg)+" kg":t.reps+" opak."):fmt(t.kg)+" kg"}${dg?`<br><span style="color:var(--warn)">${dg}</span>`:""}</div>`}).join(""):`<div class="empty">Zatím nic. Po 3 trénincích stejného cviku má appka stabilní data.</div>`}</div></section>
  <section class="card"><h2>Tělesná váha</h2>${wi.length>1?lineChart(wi):`<div class="empty">${wi.length?"Aktuálně "+fmt(wi[0].v)+" kg. Graf přibude s dalším zápisem.":"Zatím nezapsáno, počítám s 84 kg."}</div>`}
    <div class="bwrow"><input type="number" inputmode="decimal" step="0.1" id="bwIn2" placeholder="${fmt(bw())}" aria-label="Nová váha kg"><span class="hint">kg</span><button class="mini" id="bwSave2">Zapsat váhu</button></div></section>
  <section class="card"><h2>Historie</h2><div class="hist">${ws.length?ws.slice().reverse().slice(0,20).map(w=>`<div class="it"><span>${new Date(w.ts).toLocaleDateString("cs-CZ")} · ${w.nazev}</span><span class="hint">${w.cviky.length} cviků${w.trvani_min?" · "+w.trvani_min+" min":""}${w.zpetne?" · zpětně":""}${unsynced.has(w.id)?" · neodesláno":""}</span></div>`).join(""):`<div class="empty">Zatím prázdné.</div>`}</div></section>`;
  const s=document.getElementById("exSel");if(s)s.onchange=()=>{statEx=s.value;renderStats();};
  document.getElementById("bwSave2").onclick=()=>saveWeight(document.getElementById("bwIn2").value,()=>render());
  document.getElementById("backBtn").onclick=()=>{backOpen=!backOpen;renderStats();};
  const bg=document.getElementById("backGo");if(bg)bg.onclick=()=>{
    const dt=document.getElementById("backDate").value,t=document.getElementById("backT").value;if(!dt)return;
    if(draftHasData()&&!draft.back&&bg.dataset.c!=="1"){bg.dataset.c="1";bg.textContent="Rozdělaný trénink se zahodí. Klepni znovu";return;}
    sel=t;newDraft(t,dt);backOpen=false;location.hash="#dnes";
  };
}
function barChart(v){
  const W=320,H=130,max=Math.max(5,...v),bw_=26,gap=(W-30-bw_*v.length)/(v.length-1),y=n=>H-22-(n/max)*(H-36);
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Počet tréninků za posledních 8 týdnů">`;
  for(const g of [0,2,4])o+=`<line x1="24" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="18" y="${y(g)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${g}</text>`;
  o+=`<line x1="24" x2="${W}" y1="${y(4)}" y2="${y(4)}" stroke="var(--plate-green)" stroke-dasharray="4 3" stroke-width="1.5"/>`;
  v.forEach((n,i)=>{const x=30+i*(bw_+gap);o+=`<rect x="${x}" y="${y(n)}" width="${bw_}" height="${Math.max(0,H-22-y(n))}" rx="3" fill="${i===v.length-1?"var(--accent)":"var(--fig-eq)"}"/><text x="${x+bw_/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${i===v.length-1?"teď":"−"+(v.length-1-i)}</text>`;});
  return o+`</svg>`;
}
function lineChart(p){
  const W=320,H=150,L=34,R=10,T=12,B=24,vs=p.map(q=>q.v),mn=Math.floor(Math.min(...vs)*0.97),mx=Math.ceil(Math.max(...vs)*1.02),t0=p[0].t,t1=p[p.length-1].t;
  const X=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R),Y=v=>T+(mx-v)/((mx-mn)||1)*(H-T-B);
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj v čase">`;
  for(const g of [mn,(mn+mx)/2,mx])o+=`<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(g)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(g)}</text>`;
  const d=p.map((q,i)=>(i?"L":"M")+X(q.t).toFixed(1)+" "+Y(q.v).toFixed(1)).join(" ");
  o+=`<path d="${d} L${X(t1)} ${H-B} L${L} ${H-B} Z" fill="var(--accent)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="${X(t1)}" cy="${Y(p[p.length-1].v)}" r="4" fill="var(--accent)"/>`;
  o+=`<text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${new Date(t0).toLocaleDateString("cs-CZ")}</text><text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${new Date(t1).toLocaleDateString("cs-CZ")}</text>`;
  return o+`</svg>`;
}
function renderProgram(){
  document.getElementById("hTitle").textContent="Program";
  document.getElementById("hSub").textContent="Horní 1 → Spodní 1 → Horní 2 → Spodní 2";
  document.documentElement.style.setProperty("--accent",COLORS[nextId()]);
  document.getElementById("view").innerHTML=`<section class="card"><h2>Jak appka přemýšlí</h2>
   <div class="tip"><b>Jak to šlo.</b> Po sérii klepni, kolik opakování bys ještě zvládl: <b>3+</b> = lehké, dal bys ještě 3 a víc. <b>1–2</b> = těžké, ještě 1–2. <b>Hranice</b> = víc si sám netroufnu. Z toho appka pozná tvou skutečnou sílu, i když nejdeš do selhání. Klepnutím se série zároveň odškrtne. Číslo série vlevo funguje jako checkbox i samo.</div>
   <div class="tip"><b>Kalibrace a vlastní váhy.</b> První 3 tréninky každého cviku appka ladí. Když ti váha připadá malá, prostě přepiš kg. Appka se učí z toho, co jsi opravdu zvedl, a další série i trénink podle toho přepočítá.</div>
   <div class="tip"><b>Rozcvička.</b> Nemá smysl pyramida od malých vah. U prvního cviku dvě krátké série (50 % × 8 a 75 % × 3), u dalších těžkých cviků jedna (60 % × 5). Nepočítají se, jen rozhýbou a připomenou pohyb. Pak rovnou pracovní váha.</div>
   <div class="tip"><b>Vynechané cviky.</b> Když něco nestihneš, appka hlídá partie, ne celý trénink. Pokud dalším tréninkem tu partii nepokryješ, dá vynechaný cvik na začátek a vyhodí jiný na partii, kterou už máš za týden hotovou. Trénink zůstane stejně dlouhý a každá partie je aspoň 1× týdně.</div>
   <div class="tip"><b>Když jdeš pod cíl.</b> Appka hledá příčinu: cíl moc vysoko, únava a přetížení, nebo dlouhé pauzy mezi tréninky. Napíše ti to u cviku i v rozboru.</div>
   <div class="tip"><b>Plán je pevný.</b> Nálada ani bolest váhy nemění. Stav před tréninkem jde jen do rozboru: slabší den ti nesníží odhad síly. Když fakt nemůžeš, je tu tlačítko Lehčí den −5 %.</div>
   <div class="tip"><b>Tlak nahoru, který se učí.</b> Start +2,5 % za trénink. Když plníš lehce, zrychlí až na +3,5 %. Když cíl nedáš, zpomalí. Dvakrát za sebou nesplněno = jeden odlehčený trénink −5 % a pak znovu nahoru. Nesplněný cíl ve špatný den se nepočítá. Poslední série vždycky k hranici.</div>
   <div class="tip"><b>Kotouče.</b> Váhy zaokrouhlí na 25 / 20 / 15 / 10 / 5 / 2,5 kg a ukáže, co dát na stranu.</div>
   <div class="tip"><b>Pauzy.</b> Těžké vícekloubové cviky 2,5–3 min, střední 90 s, malé svaly 60 s. Mezi cviky cca 2 min. Rozcvička 5 min kardio a 2 lehčí série prvního cviku.</div></section>`+
  ORDER.map(id=>`<section class="card" style="--accent:${COLORS[id]}"><div class="row between"><h2>${PROGRAM[id].n}</h2><span class="hint">cca ${workoutMin(id)} min</span></div>${PROGRAM[id].c.map(ex=>`<div class="prog-ex">${demo(ex.pat)}<div><b>${ex.n}</b><div class="hint">${ex.s} × ${ex.r1}–${ex.r2} · pauza ${restTxt(restSec(ex))}</div></div></div>`).join("")}</section>`).join("");
}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0);});
render();renderStatus();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
sync(false);
