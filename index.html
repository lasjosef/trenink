<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141517">
<title>Trénink</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one column phone app, sticky header with workout chips, exercise cards with animated stick-figure demo */
:root{
  --bg:#f3f3f1;--surface:#ffffff;--fg:#1d1f22;--muted:#686d73;--line:#d9dbdc;
  --plate-red:#c8322b;--plate-blue:#2459b8;--plate-yellow:#c99700;--plate-green:#2f8a4a;
  --accent:var(--plate-red);--ok:#2f8a4a;--warn:#b46a00;--fig:#1d1f22;--fig-eq:#8a8f95;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517;--surface:#1e2023;--fg:#ececea;--muted:#9a9fa5;--line:#33363a;
  --plate-red:#ef5a50;--plate-blue:#5b8ef0;--plate-yellow:#e6b72e;--plate-green:#4fbf72;
  --ok:#4fbf72;--warn:#e69a2e;--fig:#ececea;--fig-eq:#7d838a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141517;--surface:#1e2023;--fg:#ececea;--muted:#9a9fa5;--line:#33363a;
  --plate-red:#ef5a50;--plate-blue:#5b8ef0;--plate-yellow:#e6b72e;--plate-green:#4fbf72;
  --ok:#4fbf72;--warn:#e69a2e;--fig:#ececea;--fig-eq:#7d838a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.05}
h2{font-size:22px}
h3{font-size:19px;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);
  padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip .next{font-size:11px;color:var(--muted);font-weight:500}
.status{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.status.err{border-color:var(--warn)}
.status button{margin-left:6px}
main{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ex-top{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start}
.ex-top>div{min-width:0}
.demo{width:112px;height:90px;border-radius:8px;background:var(--bg);color:var(--fig)}
.target{font-family:var(--display);font-size:17px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.tip{font-size:13px}
.sugg{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.sugg.up{color:var(--ok)}.sugg.hold{color:var(--muted)}.sugg.down{color:var(--warn)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px 8px;align-items:center;font-variant-numeric:tabular-nums}
.sets .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sets .n{font-family:var(--display);font-size:17px;color:var(--muted);text-align:center}
input[type=number]{width:100%;min-width:0;font:600 17px var(--body);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
input[type=number]:focus{outline:none;border-color:var(--accent)}
.done{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font-size:20px;cursor:pointer}
.done[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mini{font:600 13px var(--body);background:none;border:none;color:var(--accent);cursor:pointer;padding:4px 0}
a{color:var(--accent)}
.btn{font:700 18px var(--display);letter-spacing:.03em;text-transform:uppercase;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 16px;width:100%;cursor:pointer}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);font-size:15px;padding:10px 14px;width:auto}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{display:flex;gap:4px;max-width:640px;width:100%}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:700 16px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:10px 4px;border-radius:8px}
nav a[aria-current="page"]{color:var(--fg);background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:700 28px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;color:var(--fg)}
select{font:600 15px var(--body);padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .it{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.prog-ex{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.prog-ex .demo{width:72px;height:58px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.saved{color:var(--ok);font-weight:600;text-align:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.sets{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) auto}
.eff{display:flex;gap:3px}
.eff button{min-width:40px;padding:0 6px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font:700 13px var(--body);cursor:pointer}
.eff button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.eff button.lim[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sets .lastrow{grid-column:1/-1;font-size:12px;color:var(--accent);font-weight:600;margin-top:-2px}
.plan{font-size:13px;display:flex;flex-direction:column;gap:2px}
.plan b{font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.cal{color:var(--warn);border-color:var(--warn)}
.badge.st{color:var(--ok);border-color:var(--ok)}
.checkin{border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button,.sore button{font:600 13px var(--body);padding:9px 2px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sore{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sore button{text-align:left;padding:9px 10px;display:flex;justify-content:space-between;gap:6px}
.sore button[data-l="1"]{border-color:var(--warn);color:var(--warn)}
.sore button[data-l="2"]{background:var(--warn);border-color:var(--warn);color:#fff}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.an{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.an .d{text-align:right;font-weight:700}
.an .up{color:var(--ok)}.an .dn{color:var(--warn)}
.an .nx{grid-column:1/-1;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.bwrow{display:flex;gap:8px;align-items:center}
.bwrow input{max-width:110px}

.n.chk{width:22px;height:40px;border:none;background:none;color:var(--muted);font:700 17px var(--display);cursor:pointer;padding:0}
.n.chk[aria-pressed="true"]{color:var(--ok);font-size:20px}
details.tip summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.cover{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:4px}
.cover span{color:var(--muted)}.cover .on{color:var(--ok);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.cal .day{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-variant-numeric:tabular-nums}
.cal .day i{width:8px;height:8px;border-radius:50%;display:block}
.cal .day.today{outline:1.5px solid var(--accent)}
.cal .day.fut{opacity:.35}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.legend{font-size:12px;color:var(--muted);line-height:1.35}
.legend b{color:var(--fg)}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 15px var(--body);cursor:pointer}
.choice span{font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg2 .choice{align-items:center;padding:9px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld input{width:100%;min-width:0;font:600 16px var(--body);padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.fld input:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.maxrow{display:grid;grid-template-columns:84px 1fr 1fr;gap:8px;align-items:end}
.maxrow>span{font-weight:600;padding-bottom:10px}
.switch{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.switch input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.platechips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{min-width:52px;padding:8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font:700 14px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.pchip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--surface)}
.stepdots{display:flex;gap:6px;justify-content:center}
.stepdots i{width:28px;height:4px;border-radius:2px;background:var(--line)}.stepdots i.on{background:var(--accent)}
.slotbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 -4px}
.alts{display:flex;align-items:center;gap:6px}
.arrow{width:34px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:700 18px var(--body);cursor:pointer;line-height:1}
.arrow:disabled{opacity:.35}
.dots{display:flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.ex-top{touch-action:pan-y}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.chip.mode{margin-left:auto;color:var(--muted);font-weight:500}
details.card>summary{cursor:pointer;list-style:none}
details.card[open]{gap:10px}
.cal .day b{display:flex;gap:2px}
.btn.ghost{flex:1}
#updNote{margin-top:6px}
nav a{font-size:15px;letter-spacing:.02em;padding:10px 2px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="row between">
    <div><h1 id="hTitle">Trénink</h1><div class="sub" id="hSub"></div></div>
    <div class="sub" id="syncInfo"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="clock" class="sub" hidden style="margin-top:6px;font-variant-numeric:tabular-nums"></div>
  <div id="weighNote" class="sub" hidden style="margin-top:6px"></div>
  <div id="updNote" class="status" hidden></div>
  <div id="status" hidden></div>
</header>
<main id="view"></main>
</div>
<nav><div class="in">
  <a href="#dnes" data-v="dnes">Trénink</a>
  <a href="#statistiky" data-v="statistiky">Statistiky</a>
  <a href="#program" data-v="program">Program</a>
  <a href="#profil" data-v="profil">Profil</a>
</div></nav>
<script>
const CLIENT_ID="442015155431-ibljcsrig896c9ds3isod4utsbko7pbv.apps.googleusercontent.com";
/* ---------- katalog cviků ----------
 t: bar = tyč 20 kg + kotouče · plates = stroj na kotouče (počítají se jen kotouče) · stack = kladka / závaží na kolíček · db = jednoručka (váha jedné) · telo = vlastní váha (+ případně závaží)
 m: partie (první je hlavní) · ref/ratio: odhad startovní síly z tvých maxim · lf: kolik vlastní váhy cvik zvedá · simple: počítá se jen opakování / sekundy */
const GROUPS={zada:"Záda",nohy:"Nohy",ruce:"Ramena / ruce",hrudnik:"Hrudník"};
const MUSCLES={hrudnik:"Hrudník",zada:"Záda",ramena:"Ramena",biceps:"Biceps",triceps:"Triceps",stehna:"Stehna",hyzde:"Hýždě a zadní stehna",lytka:"Lýtka",bricho:"Břicho"};
const M2G={hrudnik:"hrudnik",zada:"zada",ramena:"ruce",biceps:"ruce",triceps:"ruce",stehna:"nohy",hyzde:"nohy",lytka:"nohy",bricho:null};
const EX={};
function X(n,pat,t,m,ref,ratio,tip,o={}){EX[n]=Object.assign({n,pat,t,m,ref,ratio,tip,g:[...new Set(m.map(x=>M2G[x]).filter(Boolean))]},o);}
// hrudník a tlaky
X("Bench press s tyčí","bench","bar",["hrudnik","triceps"],"bench",1,"Lopatky stažené, tyč na spodek hrudníku, chodidla pevně v zemi. Bez jištění nastav zarážky v racku.");
X("Bench press s jednoručkami","benchDb","db",["hrudnik","triceps"],"bench",.4,"Jednoručky dolů k hrudníku, lokty asi 45° od těla. Váha je jedna jednoručka.");
X("Bench na Smithově stroji","benchSmith","plates",["hrudnik","triceps"],"bench",.8,"Tyč na spodek hrudníku, lavice tak, aby tyč dopadala nad bradavky. Počítej jen kotouče.");
X("Tlak jednoruček na šikmé lavici","incline","db",["hrudnik","ramena"],"bench",.33,"Lavice cca 30°, lokty mírně dovnitř.");
X("Šikmý tlak na Smithově stroji","inclineBar","plates",["hrudnik","ramena"],"bench",.65,"Lavice cca 30°, tyč na horní část hrudníku. Počítej jen kotouče.");
X("Šikmý bench s tyčí","inclineBb","bar",["hrudnik","ramena"],"bench",.8,"Lavice cca 30°, tyč na horní část hrudníku, lopatky stažené.");
X("Rozpažování na kladkách","fly","stack",["hrudnik"],"bench",.15,"Lokty lehce pokrčené, ruce se potkají před hrudníkem. Váha je jedna strana.");
X("Rozpažování s jednoručkami vleže","benchDb","db",["hrudnik"],"bench",.17,"Lokty lehce pokrčené, dolů jen do pocitu protažení.");
X("Tlak jednoruček nad hlavu vsedě","ohp","db",["ramena","triceps"],"bench",.27,"Opěrka skoro kolmo, nezakláněj se, lokty pod zápěstími.");
X("Tlak nad hlavu na Smithově stroji","ohp","plates",["ramena","triceps"],"bench",.5,"Vsedě, tyč před obličejem k bradě a nahoru. Počítej jen kotouče.");
X("Tlak s tyčí vestoje","ohpStand","bar",["ramena","triceps"],"bench",.6,"Zpevni břicho a hýždě, tyč jede těsně kolem obličeje.");
X("Upažování s jednoručkami","lateral","db",["ramena"],"bench",.1,"Lokty lehce pokrčené, jen do výšky ramen, bez houpání.");
X("Upažování na spodní kladce","lateralCable","stack",["ramena"],"bench",.07,"Kladka u nohy, táhni do strany do výšky ramen.");
X("Upažování vsedě s jednoručkami","lateral","db",["ramena"],"bench",.09,"Vsedě nejde švindlovat švihem. Pomalu nahoru i dolů.");
X("Face pull na horní kladce","facepull","stack",["ramena"],"bench",.28,"Lano k obličeji, lokty vysoko a do stran.");
X("Upažování v předklonu","revfly","db",["ramena"],"bench",.08,"Předklon, záda rovná, ruce do stran jako křídla.");
X("Upažování vleže na šikmé lavici","revflyBench","db",["ramena"],"bench",.08,"Hrudníkem na lavici, ruce do stran, bez švihu.");
X("Triceps na horní kladce","pushdown","stack",["triceps"],"bench",.38,"Lokty u boků, dole propni.");
X("Francouzský tlak s jednoručkou","skull","db",["triceps"],"bench",.26,"Vleže, jednoručka oběma rukama za hlavu a zpět, lokty míří ke stropu.");
X("Dipy na lavičce","dipsBench","telo",["triceps","hrudnik"],"push",.9,"Ruce na hraně lavice, ramena dolů od uší, lokty dozadu.",{lf:.55});
// záda
X("Veslování na kladce vsedě","row","stack",["zada","biceps"],"bench",.75,"Záda rovná, přitahuj k břichu, na konci stiskni lopatky.");
X("Přítah tyče v předklonu","bbrow","bar",["zada","biceps"],"bench",.72,"Předklon cca 45°, záda rovná, tyč k pupíku.");
X("Přítah jednoručky v předklonu","dbrow","db",["zada"],"bench",.38,"Ruka a koleno na lavici, loket táhni k boku.");
X("Stahování horní kladky","pulldown","stack",["zada","biceps"],"bench",.75,"Tyč k horní části hrudníku, lokty dolů k bokům.");
X("Stahování horní kladky úzkým úchopem","pulldown","stack",["zada","biceps"],"bench",.75,"Úzký úchop nebo V-držák, lokty těsně u těla.");
X("Stahování jednoruč na kladce","pulldown","stack",["zada"],"bench",.36,"Jednou rukou, loket k boku, druhá ruka drží sedačku.");
X("Shyby na hrazdě","pullup","telo",["zada","biceps"],"pull",1,"Plný vis dole, brada nad hrazdu, bez houpání.",{lf:1});
X("Shyby podhmatem","pullup","telo",["zada","biceps"],"pull",1.03,"Dlaně k sobě, víc zabírá biceps.",{lf:1});
X("Australské přítahy","australian","telo",["zada","biceps"],"pull",.75,"Pod nízkou hrazdou, tělo rovné jako prkno, hrudník k hrazdě.",{lf:.55});
X("Negativní shyby","negative","telo",["zada","biceps"],"pull",1.1,"Vyskoč nahoru a spouštěj se 4–5 s dolů.",{lf:1});

function pose(pat,s){const P=PAT[pat],J={};for(const k in P.A){const a=P.A[k],b=(P.B[k]||a);J[k]=[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s];}return J;}
function figSVG(pat,s){
  const P=PAT[pat],J=pose(pat,s),f=v=>v.toFixed(1);
  const L=(a,b,w,c)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  let o=`<line x1="4" y1="76.5" x2="96" y2="76.5" stroke="var(--line)" stroke-width="1.5"/>`;
  for(const q of P.eq){
    if(q[0]==="rect")o+=`<rect x="${q[1]}" y="${q[2]}" width="${q[3]}" height="${q[4]}" rx="1" fill="var(--fig-eq)"/>`;
    else if(q[0]==="ln")o+=L([q[1],q[2]],[q[3],q[4]],3,"var(--fig-eq)");
    else if(q[0]==="hbar")o+=L([q[1],q[3]],[q[2],q[3]],2.5,"var(--fig-eq)");
    else if(q[0]==="rope"&&J.w&&J.w2)o+=`<path d="M${f(J.w[0])} ${f(J.w[1])} Q50 ${f(92-112*s)} ${f(J.w2[0])} ${f(J.w2[1])}" fill="none" stroke="var(--fig-eq)" stroke-width="1.2"/>`;
    else if(q[0]==="cable"){const j=J[q[3]];o+=`<circle cx="${q[1]}" cy="${q[2]}" r="3" fill="var(--fig-eq)"/>`+L([q[1],q[2]],j,1,"var(--fig-eq)");}
  }
  const c="var(--fig)";
  if(J.k2)o+=L(J.p,J.k2,3.2,c)+L(J.k2,J.a2,3.2,c);

function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}

/* ---------- diagnóza ---------- */
function diagnose(name){
  const ex=EX[name];if(!ex||ex.simple||ex.t==="kardio")return null;const hist=[];
  for(const w of workouts()){const c=w.cviky.find(x=>x.n===name);if(c)hist.push({w,c,est:sessionEst(c,ex,w.bw||bw())});}
  const h=hist.slice(-4);if(h.length<2)return null;
  const below=h.filter(x=>x.c.t&&x.c.t.kg>0&&Math.max(...x.c.sets.map(s=>+s[0]))<x.c.t.kg-.01);
  const lowR=h.filter(x=>(x.c.r||1)<.95).length>=Math.ceil(h.length/2);
  const gaps=h.slice(1).map((x,i)=>(x.w.ts-h[i].w.ts)/864e5),gap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const falling=h.length>=3&&h[h.length-1].est<h[0].est*.98;
  if(below.length>=2){const tk=fmt(below[below.length-1].c.t.kg);
    if(falling&&lowR)return `Posledně ${below.length}× pod cílem (${tk} kg) a často unavený. Vypadá to na přetížení: dej lehčí týden, víc spánku a jídla.`;
    if(falling)return `Posledně ${below.length}× pod cílem (${tk} kg) a síla klesá. Appka stáhla cíl na tvou reálnou úroveň a staví znovu.`;
    return `Posledně ${below.length}× pod cílem (${tk} kg), ale síla se drží. Příště vezmi plnou cílovou váhu, máš na ni.`;}
  if(falling){if(lowR)return "Síla klesá a v těch dnech jsi byl unavený. Spíš přetížení než slabost.";
    if(gap>6)return `Síla klesá, mezi tréninky máš v průměru ${Math.round(gap)} dní. Pravidelnost pomůže víc než váha.`;
    return "Síla klesá bez jasné příčiny. Hlídej spánek a jídlo, appka zpomalila tempo.";}
  return null;
}

const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let CRYPTO_KEY=null;
async function deriveKey(pass,saltB64){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(saltB64),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
}
async function encJSON(obj,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {enc:1,iv:b64(iv),ct:b64(ct)};}
async function decJSON(o,key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function loadKey(){if(CRYPTO_KEY)return CRYPTO_KEY;const raw=LS.get("tr4_key",null);if(!raw)return null;CRYPTO_KEY=await crypto.subtle.importKey("raw",unb64(raw),"AES-GCM",true,["encrypt","decrypt"]);return CRYPTO_KEY;}
async function setupKey(pass){ // nové heslo: sůl + kontrolní hodnota
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));const key=await deriveKey(pass,salt);
  LS.set("tr4_key",b64(await crypto.subtle.exportKey("raw",key)));CRYPTO_KEY=key;
  LS.set("tr4_keyfile",{salt,check:await encJSON({ok:1},key)});LS.set("tr4_keyfile_up",false);
}
async function unlockKey(pass,keyfile){
  const key=await deriveKey(pass,keyfile.salt);
  try{await decJSON(keyfile.check,key);}catch(e){return false;}
  LS.set("tr4_key",b64(await crypto.subtle.exportKey("raw",key)));CRYPTO_KEY=key;LS.set("tr4_keyfile",keyfile);LS.set("tr4_keyfile_up",true);return true;
}

function oauthReturn(){ // návrat z Googlu: #access_token=…&state=… nebo #error=…

async function g(url,opt={}){

async function payload(r){const key=encOn()?await loadKey():null;return key?await encJSON(r,key):r;}
async function sync(interactive){
  if(!useDrive()){syncState=PROFILE&&PROFILE.uloziste==="google"&&!CLIENT_ID?"nocfg":"local";renderStatus();return;}
  if(!navigator.onLine){syncState="offline";renderStatus();return;}

    if(!interactive){syncState="needlogin";renderStatus();return;}

  }

  try{
    let fid=await folderId(),remote;
    try{remote=await listRemote(fid);}catch(e){if(e.notfound){LS.set("tr4_folder",null);fid=await folderId();remote=await listRemote(fid);}else throw e;}
    const byRid={};for(const f of remote){const rid=f.appProperties&&f.appProperties.rid;if(rid)byRid[rid]=f;}
    // klíč k šifrování
    if(encOn()){
      if(!LS.get("tr4_key",null)){
        if(byRid.klic){const kf=await (await g(`${API}/files/${byRid.klic.id}?alt=media`)).json();needPass=kf;syncState="needpass";renderStatus();return;}
        syncState="err";syncErr="Chybí heslo k šifrování, nastav ho v Profilu";renderStatus();return;
      }
      if(!byRid.klic&&LS.get("tr4_keyfile",null)){const m=multipart({name:"klic.json",parents:[fid],mimeType:"application/json",appProperties:{rid:"klic"}},LS.get("tr4_keyfile"));await g(`${UP}/files?uploadType=multipart&fields=id`,{method:"POST",...m});}
    }

    for(const id of [...unsynced]){
      const r=DB[id];if(!r){unsynced.delete(id);continue;}
      const body=await payload(r);
      if(id==="profil"&&byRid.profil){await g(`${UP}/files/${byRid.profil.id}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});}
      else if(!byRid[id]){const m=multipart({name:fileName(r),parents:[fid],mimeType:"application/json",appProperties:{rid:id}},body);await g(`${UP}/files?uploadType=multipart&fields=id`,{method:"POST",...m});}
      unsynced.delete(id);saveDB();
    }
    // stáhnout, co v telefonu chybí (jiný telefon, obnova)
    let pulled=0;const key=await loadKey();
    for(const f of remote){
      const rid=f.appProperties&&f.appProperties.rid;if(!rid||rid==="klic")continue;
      if(rid!=="profil"&&DB[rid])continue;
      if(rid==="profil"&&PROFILE&&PROFILE.ts&&new Date(f.modifiedTime).getTime()<PROFILE.ts+5000)continue;
      try{let rec=await (await g(`${API}/files/${f.id}?alt=media`)).json();
        if(rec&&rec.enc){if(!key)continue;rec=await decJSON(rec,key);}
        if(!rec||!rec.id)continue;
        if(rid==="profil"){if(!PROFILE||(rec.data&&rec.data.ts>(PROFILE.ts||0))){PROFILE=rec.data;LS.set("tr4_profile",PROFILE);DB.profil=rec;pulled++;}}
        else{DB[rec.id]=rec;pulled++;}
      }catch(e){}
    }
    saveDB();LS.set("tr4_lastsync",Date.now());syncState="ok";
    if(pulled)render();

    if(e&&e.auth)syncState="needlogin";else{syncState="err";syncErr=(e&&e.message)||"Synchronizace selhala";}

}

const OTHER={H1:"H2",H2:"H1",S1:"S2",S2:"S1",V1:"V2",V2:"V1"};
function doneSince(ts){const s=new Set();for(const w of workouts())if(w.ts>=ts)for(const c of w.cviky)if(c.sets.length)s.add(c.n);return s;}
// Vynechané partie: cvik z minulého tréninku stejné poloviny nahradí cvik na partii, která už je tento týden hotová.
function carryFor(tid){
  const none={add:[],drop:[]},o=OTHER[tid];if(!o)return none;
  const wk=Date.now()-7*864e5;if(!workouts().some(w=>w.trenink===o&&w.ts>=wk))return none;
  const done=doneSince(wk),hit=new Set();for(const n of done)if(EX[n])hit.add(EX[n].m[0]);
  const today=PROGRAM[tid].c,todayPrim=new Set(today.map(sl=>EX[slotEx(sl).n].m[0]));
  const add=PROGRAM[o].c.filter(sl=>{const n=slotEx(sl).n,p=EX[n].m[0];return !done.has(n)&&!hit.has(p)&&!todayPrim.has(p);}).slice(0,2);
  if(!add.length)return none;
  const cnt={};today.forEach(sl=>{const p=EX[slotEx(sl).n].m[0];cnt[p]=(cnt[p]||0)+1;});
  const score=sl=>{const p=EX[slotEx(sl).n].m[0];return (hit.has(p)?2:0)+(cnt[p]>1?1:0);};
  const drop=today.map((sl,i)=>[sl,i]).filter(([sl])=>score(sl)>0).sort((x,y)=>score(y[0])-score(x[0])||y[1]-x[1]).slice(0,add.length).map(x=>x[0].id);

}
function newDraft(tid,back){
  const P=PROGRAM[tid],cf=back?{add:[],drop:[]}:carryFor(tid);

  for(const sl of cf.add.slice().reverse()){if(ISO.has(EX[slotEx(sl).n].pat))list.splice(1,0,sl);else list.unshift(sl);}
  const ret=P.mode==="gym"&&!back&&daysSinceMode("gym")>14&&workouts().some(w=>PROGRAM[w.trenink]&&PROGRAM[w.trenink].mode==="gym");
  draft={v4:1,tid,back:back||null,started:null,lastSetAt:null,stav:{energie:2,bolest:{},ok:!!back},ret,
    carry:cf.add.map(s=>s.id),dropped:cf.drop,slots:list.map(sl=>({id:sl.id,n:slotEx(sl).n})),sets:[],targets:[]};
  replan(true);return draft;

const slotOf=id=>{for(const k in PROGRAM)for(const sl of PROGRAM[k].c)if(sl.id===id)return sl;return null;};
function replan(all){
  const d=draft,R=(d.stav.lehci?.95:1)*(d.ret?.9:1);

    const sl=slotOf(s.id);
    if(!d.sets[i])d.sets[i]=Array.from({length:sl.s},()=>[d.targets[i].kg,"","",false,false]);
    d.sets[i].forEach(x=>{if(!x[3]&&!x[4]&&(x[1]===""||all))x[0]=d.targets[i].kg;});

function relive(i){

  for(let k=1;k<a.length;k++){if(a[k][3]||a[k][4])continue;const v=liveKg(ex,sl,a,k);if(v!=null)a[k][0]=v;}
}
function swapAlt(i,dir){

  v.forEach((n,i)=>{const x=30+i*(bw_+gap);o+=`<rect x="${x}" y="${y(n)}" width="${bw_}" height="${Math.max(0,H-22-y(n))}" rx="3" fill="${i===v.length-1?"var(--accent)":"var(--fig-eq)"}"/><text x="${x+bw_/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${i===v.length-1?"teď":"−"+(v.length-1-i)}</text>`;});

function lineChart(p){
  const W=320,H=150,L=34,R=10,T=12,B=24,vs=p.map(q=>q.v),mn=Math.floor(Math.min(...vs)*0.97),mx=Math.ceil(Math.max(...vs)*1.02),t0=p[0].t,t1=p[p.length-1].t;
  const X=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R),Y=v=>T+(mx-v)/((mx-mn)||1)*(H-T-B);
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj v čase">`;
  for(const g of [mn,(mn+mx)/2,mx])o+=`<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(g)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(g)}</text>`;
  const d=p.map((q,i)=>(i?"L":"M")+X(q.t).toFixed(1)+" "+Y(q.v).toFixed(1)).join(" ");
  o+=`<path d="${d} L${X(t1)} ${H-B} L${L} ${H-B} Z" fill="var(--accent)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="${X(t1)}" cy="${Y(p[p.length-1].v)}" r="4" fill="var(--accent)"/>`;
  o+=`<text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${new Date(t0).toLocaleDateString("cs-CZ")}</text><text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${new Date(t1).toLocaleDateString("cs-CZ")}</text>`;
  return o+`</svg>`;
}

const num=id=>{const el=document.getElementById(id);if(!el)return undefined;const v=el.value.replace(",",".");return v===""?"":+v;};
function readStep(p,step){

async function validateStep(p,step){
  if(step===0&&!p.jmeno)return "Napiš jméno.";
  if(step===1&&p.uloziste==="google"&&!CLIENT_ID)return "Google Disk zatím nejde, vyber telefon.";
  if(step===1&&p.uloziste==="google"&&p.sifrovat&&!LS.get("tr4_key",null)){
    const a=document.getElementById("f-pass1"),b=document.getElementById("f-pass2");if(!a)return "";
    if(a.value.length<8)return "Heslo musí mít aspoň 8 znaků.";if(a.value!==b.value)return "Hesla se neshodují.";

  if(step===2&&!(p.vaha>30&&p.vaha<250))return "Zadej váhu v kg.";

  document.getElementById("hSub").textContent=mode==="gym"?"Posilovna · Horní 1 → Spodní 1 → Horní 2 → Spodní 2":"Vlastní váha · Celé tělo A ↔ B, 2× kardio";
  document.documentElement.style.setProperty("--accent",COLORS[nextId(mode)]);
  const rot=PROFILE.rot&&PROFILE.rot.on?`<div class="tip"><b>Střídání.</b> Od ${new Date(PROFILE.rot.start+"T12:00").toLocaleDateString("cs-CZ")} ${PROFILE.rot.away} týdny vlastní váha, pak ${PROFILE.rot.home} týdny posilovna, pořád dokola. Dnes: <b>${modeOn(Date.now())==="gym"?"posilovna":"vlastní váha"}</b>. Po návratu do posilovny je první trénink odlehčený o 10 %.</div>`:"";
  const list=ids=>ids.map(id=>{const P=PROGRAM[id];return `<section class="card" style="--accent:${COLORS[id]}"><div class="row between"><h2>${P.n}</h2><span class="hint">cca ${workoutMin(id)} min</span></div>
    ${P.c.map(sl=>{const cur=slotEx(sl).n,ex=EX[cur];return `<div class="prog-ex">${demo(ex.pat)}<div><span class="lbl">${sl.n} · ${P.cardio?"12–15 min":sl.s+" × "+sl.r1+"–"+sl.r2+(ex.sec?" s":"")}</span><div><b>${cur}</b></div><div class="hint">Náhrady: ${sl.alts.filter(a=>a!==cur).join(", ")}</div></div></div>`;}).join("")}</section>`;}).join("");
  document.getElementById("view").innerHTML=`<section class="card"><h2>Jak appka přemýšlí</h2>${rot}
   <div class="tip"><b>Jak to šlo.</b> Po sérii klepni, kolik opakování bys ještě zvládl: <b>3+</b> lehké, <b>1–2</b> těžké, <b>Hranice</b> víc si sám netroufnu. Z toho appka pozná skutečnou sílu, i když nejdeš do selhání. Klepnutím se série odškrtne.</div>
   <div class="tip"><b>Kalibrace.</b> Startovní váhy jsou z tvých maxim v Profilu. První 3 tréninky každého cviku appka ladí. Váha ti připadá malá? Přepiš ji, appka se učí z toho, co jsi opravdu zvedl.</div>
   <div class="tip"><b>Plán je pevný.</b> Stav před tréninkem jde jen do rozboru. Pro opravdu špatný den je tlačítko Lehčí den −5 %.</div>
   <div class="tip"><b>Tlak nahoru.</b> Start +2,5 % za trénink. Splníš lehce: až +3,5 %. Nesplníš: zpomalí. Dvakrát nesplněno: jeden odlehčený trénink a znovu nahoru.</div>
   <div class="tip"><b>Náhrady.</b> Cvik, který nemůžeš dělat nebo je obsazený, přepneš swipem nebo šipkami. Každá náhrada má vlastní kalibraci a appka si tvou volbu pamatuje.</div>
   <div class="tip"><b>Vynechané partie.</b> Nestihneš něco? Další trénink stejné poloviny ho zařadí místo cviku na partii, kterou už za týden máš. Délka zůstane stejná.</div>
   <div class="tip"><b>Rozcvička.</b> U prvního těžkého cviku 50 % × 8 a 75 % × 3, u dalších těžkých 60 % × 5. Pak rovnou pracovní váha.</div></section>
   <h2 style="margin-top:6px">${mode==="gym"?"Posilovna":"Vlastní váha"}</h2>${list(mode==="gym"?ORDERS.gym:[...ORDERS.bw,"K"])}
   <details class="card"><summary><b>${mode==="gym"?"Vlastní váha":"Posilovna"}</b> <span class="hint">(druhý režim)</span></summary>${list(mode==="gym"?[...ORDERS.bw,"K"]:ORDERS.gym)}</details>`;
}

/* ---------- navigace ---------- */
const view=()=>(location.hash||"#dnes").slice(1);
function render(){
  if(!PROFILE&&view()!=="start"){location.hash="#start";return;}
  const v=view();
  document.querySelector("nav").hidden=v==="start";
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  document.getElementById("chips").hidden=v!=="dnes";
  renderWeighNote();
  if(v==="start")renderStart();else if(v==="statistiky")renderStats();else if(v==="program")renderProgram();else if(v==="profil")renderProfile();else renderToday();
  renderStatus();animate();tickClock();
}
let weighOpen=false;
function renderWeighNote(){
  const el=document.getElementById("weighNote");
  if(!PROFILE||view()==="start"||!needWeigh()||Date.now()-LS.get("tr4_weigh_snooze",0)<3*864e5){el.hidden=true;return;}
  const w=weighins(),txt=w.length?`Váha naposledy před ${Math.round((Date.now()-w[w.length-1].ts)/864e5)} dny`:"Zatím žádná zapsaná váha";
  el.hidden=false;
  el.innerHTML=weighOpen?`<div class="bwrow"><input type="number" inputmode="decimal" step="0.1" id="bwIn" value="${bw()}" aria-label="Tělesná váha kg"><span class="hint">kg</span><button class="mini" id="bwSave">Uložit</button><button class="mini" id="bwLater" style="color:var(--muted)">Později</button></div>`
    :`<button class="mini" id="bwOpen" style="color:var(--muted);font-weight:500">${txt}. Zapsat ›</button>`;
  const o=document.getElementById("bwOpen");if(o)o.onclick=()=>{weighOpen=true;renderWeighNote();};
  const l=document.getElementById("bwLater");if(l)l.onclick=()=>{LS.set("tr4_weigh_snooze",Date.now());weighOpen=false;renderWeighNote();};
  const s=document.getElementById("bwSave");if(s)s.onclick=()=>saveWeight(document.getElementById("bwIn").value,()=>{weighOpen=false;render();});
}
async function saveWeight(v,done){
  const kg=parseFloat(String(v).replace(",","."));if(!(kg>30&&kg<250))return;
  const now=Date.now();await store({v:4,typ:"vaha",id:"v"+now,ts:now,date:todayISO(),kg});
  if(draft&&!draftHasData())replan(false);done&&done();
}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0);});
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had){had=true;return;}
    const n=document.getElementById("updNote");n.hidden=false;n.innerHTML=`Je nová verze appky. <button class="mini" id="updBtn">Obnovit</button>`;document.getElementById("updBtn").onclick=()=>location.reload();});
}
const fromGoogle=oauthReturn();
render();sync(fromGoogle&&!!tok());

</script>
